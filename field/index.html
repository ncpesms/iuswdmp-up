<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a2a66">
<meta name="robots" content="noindex">
<title>IUSWDMP Field Survey</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{--navy:#0a2a66;--blue:#1565c0;--sky:#e8f2fb;--red:#c62828;--green:#0b7d6e;--amber:#b45309;--txt:#16233a;--mut:#62708a;--line:#d9e2ee;--bg:#f5f8fc;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Sans",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--sans);color:var(--txt);background:var(--bg);font-size:16px;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100dvh}
header{flex:none;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
header h1{margin:0;font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-size:11px;font-weight:500;opacity:.8}
.net{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:#16a34a;white-space:nowrap}
.net.off{background:#b45309}
.lang{display:flex;border:1.5px solid rgba(255,255,255,.5);border-radius:99px;overflow:hidden;flex:none}
.lang button{border:0;background:none;color:#fff;padding:5px 10px;font-size:12.5px;font-weight:600}
.lang button.on{background:#fff;color:var(--navy)}
.hbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;min-width:40px;height:40px;font-size:20px}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#vMap{overflow:hidden}
#map{position:absolute;inset:0;background:#dde3ea}
nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:12.5px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--navy)}
nav svg{width:24px;height:24px}
nav .badge{position:absolute;margin-left:30px;margin-top:-4px;background:var(--amber);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:500;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:17px;padding:15px 26px;border-radius:99px;box-shadow:0 6px 18px rgba(10,42,102,.4);display:flex;align-items:center;gap:8px;white-space:nowrap}
.gps{position:absolute;top:10px;left:10px;z-index:500;background:#fff;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;background:#9ca3af;flex:none}
.dot.g{background:#16a34a}.dot.a{background:#d97706}.dot.r{background:#c62828}
.mbtn{position:absolute;top:10px;right:10px;z-index:500;width:44px;height:44px;border-radius:10px;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:20px;color:var(--navy)}
.legend{position:absolute;left:10px;bottom:18px;z-index:400;background:rgba(255,255,255,.94);border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.7}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.pad{padding:14px 14px 28px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.card h3{margin:0 0 9px;font-size:14.5px;color:var(--navy);display:flex;align-items:center;gap:8px}
.card h3 .req{color:var(--red);font-weight:700}
.card h3 .ok{margin-left:auto;color:#16a34a;font-size:18px}
.hint{font-size:12.5px;color:var(--mut);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;font-size:14.5px;font-weight:600;min-height:46px}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:16px;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:4px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--navy);color:#fff;width:100%;min-height:52px}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.warn{background:var(--amber)}
.btn:disabled{opacity:.45}
.gpsbar{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.gpsbar small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.mini{height:150px;border-radius:10px;margin-top:10px;overflow:hidden;background:#dde3ea}
.compass{display:flex;align-items:center;gap:14px}
.dial{width:108px;height:108px;border-radius:50%;border:3px solid var(--navy);position:relative;flex:none;background:var(--sky)}
.dial .n{position:absolute;inset:0;transition:transform .15s linear}
.dial .n b{position:absolute;left:50%;top:3px;transform:translateX(-50%);font-size:12px;color:var(--red)}
.dial .arr{position:absolute;left:50%;top:50%;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:44px solid var(--navy);transform:translate(-50%,-70%)}
.dial .arr::after{content:"";position:absolute;left:-5px;top:44px;width:10px;height:22px;background:var(--navy)}
.cval{font-size:22px;font-weight:700;color:var(--navy)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;background:#fafcff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--mut);text-align:center;padding:4px;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;z-index:2}
.ph svg{width:26px;height:26px;margin-bottom:3px}
.alert{border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-top:10px}
.alert.w{background:#fff4e0;color:#8a4b00;border:1px solid #f3cf8e}
.alert.e{background:#fdecec;color:#9b1c1c;border:1px solid #f5b5b5}
.alert.g{background:#e7f6f1;color:#0b5d52;border:1px solid #a9dccf}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--navy)}
.stat span{font-size:11.5px;color:var(--mut);font-weight:600}
.item{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:8px;width:100%;text-align:left}
.item img,.item .noimg{width:58px;height:58px;border-radius:8px;object-fit:cover;background:var(--sky);flex:none}
.item b{display:block;font-size:14.5px}
.item small{color:var(--mut);font-size:12px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.s{background:#fff4e0;color:#8a4b00}.tag.u{background:#e7f6f1;color:#0b5d52}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.kv td:first-child{color:var(--mut);width:42%}
.login{min-height:100dvh;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.login .box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:380px}
.login img{height:62px;display:block;margin:0 auto 8px}
.login h2{text-align:center;margin:0 0 2px;color:var(--navy);font-size:20px}
.login p{text-align:center;margin:0 0 16px;color:var(--mut);font-size:13px}
.sheet{position:fixed;inset:0;z-index:2000;background:rgba(10,20,40,.5);display:flex;align-items:flex-end}
.sheet .in{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:82dvh;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet .list{overflow:auto;margin-top:10px}
.sheet .list button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 4px;font-size:15px;text-align:left}
.sheet .list small{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16233a;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:3000;max-width:90vw;text-align:center}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 2px #2563eb55}
.pin{width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.leaflet-popup-content{margin:10px 12px;font-family:var(--sans);font-size:13.5px}
.leaflet-popup-content .btn{padding:9px 12px;min-height:40px;font-size:14px;margin-top:8px}
.cap{display:flex;flex-direction:column;height:100%;padding:10px 12px 12px;gap:9px;max-width:560px;margin:0 auto}
.strip{display:flex;gap:8px}
.pill{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.pill.gr{flex:1}.pill span.tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.how{font-size:13.5px;color:var(--mut);text-align:center;margin:0;line-height:1.35}
.seg{display:flex;border:1.5px solid var(--navy);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 4px;font-size:14px;font-weight:700;color:var(--navy);min-height:44px}
.seg button.on{background:var(--navy);color:#fff}
.trio{flex:1;display:grid;grid-template-columns:1fr 112px 1fr;gap:8px;align-items:stretch;min-height:190px}
.side{border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 4px;line-height:1.2}
.side svg{width:38px;height:38px}
.side:disabled{opacity:.4}
.side small{font-weight:500;font-size:11.5px;opacity:.85}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:repeating-linear-gradient(#cfd8e3 0 14px,#dfe6ee 14px 28px);border-radius:10px;padding:6px 2px}
.mid .dial{width:100px;height:100px;background:#fff}
.mid .cval{font-size:16px;background:#fff;border-radius:8px;padding:1px 7px}
.man{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.man button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:9px 2px;font-weight:700;font-size:13.5px}
.man button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lnk{border:0;background:none;color:var(--mut);font-weight:600;font-size:14px;padding:10px;text-decoration:underline;width:100%}
.zoomhint{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:450;background:rgba(22,35,58,.85);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;white-space:nowrap}
</style>
</head>
<body>
<div id="login" class="login" hidden></div>
<div id="app" hidden>
  <header>
    <button class="hbtn" id="back" hidden aria-label="Back">&#8592;</button>
    <h1><span id="ttl">IUSWDMP</span><small id="sub"></small></h1>
    <span class="net" id="net"></span>
    <span class="lang"><button data-l="hi">हिंदी</button><button data-l="en">EN</button></span>
  </header>
  <main>
    <section class="view" id="vCap"><div class="cap" id="cap"></div></section>
    <section class="view" id="vMap" hidden>
      <div id="map"></div>
      <div class="gps"><span class="dot" id="gDot"></span><span id="gTxt"></span></div>
      <button class="mbtn" id="locate" aria-label="My location">&#9678;</button>
      <div class="zoomhint" id="zh" hidden></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="view" id="vWork" hidden><div class="pad" id="work"></div></section>
    <section class="view" id="vDet" hidden><div class="pad" id="det"></div></section>
  </main>
  <nav id="nav">
    <button data-v="vCap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-t="Capture"></span></button>
    <button data-v="vMap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="Map"></span></button>
    <button data-v="vWork"><span class="badge" id="badge" hidden></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-t="My work"></span></button>
  </nav>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<script src="leaflet.js"></script>
<script>
"use strict";
/* ===================== settings ===================== */
const CITY = {id:'varanasi', name:'Varanasi', hi:'वाराणसी', roads:'roads_varanasi.json', center:[25.3176,82.9739]};
const API = '';                 // upload service address. Empty = test mode: data stays on the phone and is shared as a file.
const SNAP = 30;                // metres: a capture is linked to the nearest mapped road within this distance
const ACC_WARN = 15;            // metres: above this the capture is flagged as low accuracy
const AVG_MS = 5000;            // GPS readings from the last few seconds are averaged
const OFFSET = 2;               // metres: the point is placed this far from the road centre line, on the chosen side

/* ===================== language ===================== */
const HI = {
"Field Survey":"फील्ड सर्वे","Capture":"कैप्चर","Map":"मानचित्र","My work":"मेरा काम","Online":"ऑनलाइन","Offline":"ऑफ़लाइन",
"Your name":"आपका नाम","Mobile number":"मोबाइल नंबर","PIN":"पिन","Start":"शुरू करें","Drain flow direction survey":"नाला प्रवाह दिशा सर्वे",
"Enter your name":"अपना नाम लिखें","Enter a 10-digit mobile number":"10 अंकों का मोबाइल नंबर लिखें",
"Finding GPS…":"जीपीएस खोज रहा है…","GPS off or blocked":"जीपीएस बंद है या अनुमति नहीं","Allow location for this app in phone settings, then reopen.":"फ़ोन सेटिंग में इस ऐप को लोकेशन की अनुमति दें, फिर दोबारा खोलें।",
"Road":"सड़क","away":"दूर","No mapped road nearby":"पास में कोई मैप की हुई सड़क नहीं","Weak GPS. Stand in the open for a few seconds.":"जीपीएस कमज़ोर है। कुछ सेकंड खुले में खड़े हों।",
"Stand by the drain. Point the phone the way the water flows. Tap the side the drain is on.":"नाले के पास खड़े हों। फ़ोन उस ओर करें जिधर पानी बह रहा है। जिस तरफ़ नाला है वह बटन दबाएँ।",
"Point the phone along the road. Tap the side the drain is on.":"फ़ोन सड़क की दिशा में करें। जिस तरफ़ नाला है वह बटन दबाएँ।",
"Flowing":"बह रहा है","No flow":"बहाव नहीं","Not sure":"पक्का नहीं","Left drain":"बायाँ नाला","Right drain":"दायाँ नाला","photo":"फोटो",
"No drain on this road":"इस सड़क पर नाला नहीं","Turn on compass":"कंपास चालू करें","Compass not available. Choose the flow direction:":"कंपास उपलब्ध नहीं। प्रवाह की दिशा चुनें:",
"Saved":"सहेजा गया","Left":"बायाँ","Right":"दायाँ","Optional details":"अतिरिक्त जानकारी (ज़रूरी नहीं)","Drain type":"नाले का प्रकार","Kachha":"कच्चा","Pucca open":"पक्का खुला","Pucca covered":"पक्का ढका",
"Problem":"समस्या","Garbage":"कचरा","Blocked":"जाम","Broken wall":"टूटी दीवार","Encroachment":"अतिक्रमण","Add photo":"और फोटो","Done":"हो गया","Today":"आज",
"Not visited":"अभी नहीं देखी","Flow captured":"प्रवाह दर्ज","No flow / not sure":"बहाव नहीं / पक्का नहीं","No drain":"नाला नहीं","Zoom in to see roads":"सड़कें देखने के लिए ज़ूम करें",
"Waiting to upload":"अपलोड बाकी","Uploaded":"अपलोड हुए","Sync now":"अभी सिंक करें","Share today's file":"आज की फ़ाइल भेजें","Share all points":"सभी बिंदु भेजें",
"No captures yet. Open Capture and tap the side the drain is on.":"अभी कोई कैप्चर नहीं। कैप्चर खोलें और जिस तरफ़ नाला है वह बटन दबाएँ।","Earlier":"पहले के",
"Test mode: captures stay on this phone. Send the file to your supervisor at the end of the day.":"टेस्ट मोड: कैप्चर इसी फ़ोन में रहते हैं। दिन के अंत में फ़ाइल अपने सुपरवाइज़र को भेजें।",
"File ready":"फ़ाइल तैयार","Nothing to share":"भेजने के लिए कुछ नहीं","Capture details":"कैप्चर का विवरण","Edit details":"जानकारी बदलें","Delete capture":"कैप्चर हटाएँ","Delete this capture and its photos from this phone?":"क्या यह कैप्चर और इसकी फोटो इस फ़ोन से हटाएँ?","Yes, delete":"हाँ, हटाएँ","Cancel":"रद्द करें",
"Surveyor":"सर्वेयर","Time":"समय","Location":"स्थान","Low accuracy":"कम सटीकता","Sign out":"साइन आउट","Flow direction":"प्रवाह की दिशा","Side":"तरफ़","Not on a mapped road":"मैप की हुई सड़क पर नहीं",
"Direction is across the road. Check that the phone points along the drain.":"दिशा सड़क के आर-पार है। देखें कि फ़ोन नाले की दिशा में है।","Saved on phone":"फ़ोन में सहेजा",
"Upload failed. Will try again.":"अपलोड नहीं हुआ। दोबारा कोशिश होगी।","All uploaded":"सब अपलोड हो गया","No signal":"सिग्नल नहीं","Photo could not be read":"फोटो नहीं पढ़ी जा सकी","Wait for GPS":"जीपीएस का इंतज़ार करें",
"Uploaded captures can no longer be changed here.":"अपलोड हुए कैप्चर यहाँ नहीं बदले जा सकते।","captures":"कैप्चर","roads":"सड़कें"
};
let LANG = 'hi';
try { LANG = localStorage.getItem('fs_lang') || 'hi'; } catch(e){}
const t = k => LANG === 'hi' && HI[k] ? HI[k] : k;
const DIRS = ['N','NE','E','SE','S','SW','W','NW'];
const DIRS_HI = ['उत्तर','उ-पू','पूर्व','द-पू','दक्षिण','द-प','पश्चिम','उ-प'];
const dirName = b => (LANG==='hi'?DIRS_HI:DIRS)[Math.round(b/45)%8];

/* ===================== small helpers ===================== */
const $ = s => document.querySelector(s);

/* ===================== road network ===================== */

/* ===================== map ===================== */

function renderLogin(){ $('#login').hidden = false; $('#app').hidden = true;
  $('#login').innerHTML = `<div class="box"><img src="ncpe.jpg" alt="NCPE"><h2>IUSWDMP · ${t('Field Survey')}</h2><p>${t('Drain flow direction survey')} · ${LANG==='hi'?CITY.hi:CITY.name}</p>
   <label class="f">${t('Your name')}</label><input class="inp" id="lName" autocomplete="name" style="margin-bottom:10px">
   <label class="f">${t('Mobile number')}</label><input class="inp" id="lPhone" inputmode="numeric" maxlength="10" autocomplete="tel-national" style="margin-bottom:10px">
   ${API ? `<label class="f">${t('PIN')}</label><input class="inp" id="lPin" type="password" inputmode="numeric" maxlength="6" style="margin-bottom:10px">` : ''}
   <div class="alert e" id="lErr" hidden></div><button class="btn" id="lGo" style="margin-top:12px">${t('Start')}</button>
   <div style="display:flex;justify-content:center;margin-top:14px"><span class="lang" style="border-color:var(--navy)"><button data-l="hi" style="${LANG==='hi'?'background:var(--navy);color:#fff':'color:var(--navy)'}">हिंदी</button><button data-l="en" style="${LANG==='en'?'background:var(--navy);color:#fff':'color:var(--navy)'}">English</button></span></div></div>`;
  $('#lGo').onclick = async () => { const name = $('#lName').value.trim(), phone = $('#lPhone').value.replace(/\D/g,''), er = $('#lErr');
    const fail = m => { er.textContent = t(m); er.hidden = false; };
    if (name.length < 2) return fail('Enter your name'); if (phone.length !== 10) return fail('Enter a 10-digit mobile number');
    let token = null;
    if (API){ try { const r = await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone, pin:$('#lPin').value})}); if (!r.ok) return fail('PIN'); token = (await r.json()).token; } catch(e){ return fail('No signal'); } }
    USER = {name, phone, token}; try { localStorage.setItem('fs_user', JSON.stringify(USER)); } catch(e){}
    startCompass(); startApp(); }; }

/* ===================== my work, details ===================== */
async function refresh(){ POINTS = (await dbAll('points')).sort((a,b) => b.time-a.time); RSTAT = new Map();
  for (const p of POINTS){ if (p.road == null || p.roadV !== ROADV) continue; const cur = RSTAT.get(p.road), st = p.state === 'flow' ? 'flow' : p.state === 'nodrain' ? 'nodrain' : 'weak';
    if (!cur || st === 'flow' || (st === 'weak' && cur === 'nodrain')) RSTAT.set(p.road, st); }
  drawRoads(); drawPoints(); const w = POINTS.filter(p => p.status === 'saved').length; $('#badge').hidden = !w; $('#badge').textContent = w; }
const titleOf = p => p.state === 'nodrain' ? t('No drain') : `${sideText(p)} · ${stateText(p)}`;
async function renderWork(){ const w = $('#work'), today = dayKey(Date.now()), td = POINTS.filter(p => dayKey(p.time) === today), wait = POINTS.filter(p => p.status === 'saved').length;
  let h = `<div class="stats"><div class="stat"><b>${td.length}</b><span>${t('Today')}</span></div><div class="stat"><b>${new Set(td.filter(p => p.road != null).map(p => p.road)).size}</b><span>${t('roads')} · ${t('Today')}</span></div><div class="stat"><b>${wait}</b><span>${t('Waiting to upload')}</span></div></div>`;
  h += API ? `<button class="btn" id="wSync" ${wait?'':'disabled'}>${t('Sync now')}</button>` : `<div class="alert w" style="margin:0 0 10px">${t("Test mode: captures stay on this phone. Send the file to your supervisor at the end of the day.")}</div><button class="btn" id="wToday">${t("Share today's file")} (${td.length})</button><button class="btn sec" id="wAll" style="margin-top:8px">${t('Share all points')} (${POINTS.length})</button>`;
  if (!POINTS.length) h += `<p class="hint" style="text-align:center;margin-top:26px;font-size:14px">${t('No captures yet. Open Capture and tap the side the drain is on.')}</p>`;
  let lastDay = '';
  for (const p of POINTS){ const k = dayKey(p.time); if (k !== lastDay){ h += `<h4 style="margin:18px 2px 8px;font-size:13px;color:var(--mut)">${k === today ? t('Today') : k.split('-').reverse().join('-')}</h4>`; lastDay = k; }
    h += `<button class="item" data-id="${p.id}"><span class="noimg" data-ph="${p.id}"></span><span style="flex:1;min-width:0"><b>${titleOf(p)}</b><small>${fmtTime(p.time).slice(11)} · ±${Math.round(p.gps.acc)} m · ${p.roadType ? t('Road')+' '+p.roadType : t('Not on a mapped road')}</small></span><span class="tag ${p.status==='uploaded'?'u':'s'}">${t(p.status==='uploaded'?'Uploaded':'Saved')}</span></button>`; }
  h += `<button class="btn sec" id="wOut" style="margin-top:22px;border-color:var(--line);color:var(--mut)">${t('Sign out')} · ${esc(USER.name)}</button>`;
  w.innerHTML = h;
  w.querySelectorAll('.item').forEach(b => b.onclick = () => openDet(b.dataset.id));
  const s = $('#wSync'); if (s) s.onclick = () => sync(false); const a = $('#wToday'); if (a) a.onclick = () => shareZip(td, today); const al = $('#wAll'); if (al) al.onclick = () => shareZip(POINTS, 'all');
  $('#wOut').onclick = () => { try { localStorage.removeItem('fs_user'); } catch(e){} USER = null; renderLogin(); };
  for (const el of w.querySelectorAll('[data-ph]')){ const ph = await photosOf(el.dataset.ph); if (ph[0]){ const i = new Image(); i.src = URL.createObjectURL(ph[0].blob); i.alt = ''; el.replaceWith(i); } } }
let detId = null;
async function openDet(id){ const p = await dbGet('points', id); if (!p) return; detId = id; const ph = await photosOf(id); show('vDet');
  const rows = [[t('Flow direction'),stateText(p)],[t('Side'),sideText(p)],[t('Road'),p.roadType ? `${p.roadType} · ${p.roadDist} m` : t('Not on a mapped road')],[t('Time'),fmtTime(p.time)],
    [t('Location'),`${p.gps.lat.toFixed(6)}, ${p.gps.lon.toFixed(6)} (±${Math.round(p.gps.acc)} m)${p.lowAcc?' · '+t('Low accuracy'):''}`],[t('Drain type'),p.dtype?t(p.dtype):'–'],[t('Problem'),p.problems.length?p.problems.map(t).join(', '):'–'],[t('Surveyor'),esc(p.surveyor)]];
  $('#det').innerHTML = `${ph.length ? `<div class="card"><div class="photos">${ph.map(x => `<div class="ph" style="border-style:solid"><img src="${URL.createObjectURL(x.blob)}" alt=""></div>`).join('')}</div></div>` : ''}
   <div class="card"><span class="tag ${p.status==='uploaded'?'u':'s'}">${t(p.status==='uploaded'?'Uploaded':'Saved on phone')}</span>${p.along==='cross'?`<div class="alert w">${t('Direction is across the road. Check that the phone points along the drain.')}</div>`:''}<table class="kv" style="margin-top:8px">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
   ${p.status === 'saved' ? `${p.state !== 'nodrain' ? `<button class="btn" id="dEdit">${t('Edit details')}</button>` : ''}<button class="btn sec" id="dDel" style="margin-top:8px;border-color:var(--red);color:var(--red)">${t('Delete capture')}</button>` : `<p class="hint" style="text-align:center">${t('Uploaded captures can no longer be changed here.')}</p>`}`;
  const e = $('#dEdit'); if (e) e.onclick = () => afterSheet(id);
  const d = $('#dDel'); if (d) d.onclick = () => { const s = document.createElement('div'); s.className = 'sheet';
    s.innerHTML = `<div class="in"><b style="font-size:16px">${t('Delete this capture and its photos from this phone?')}</b><button class="btn" style="background:var(--red);margin-top:14px" data-y="1">${t('Yes, delete')}</button><button class="btn sec" style="margin-top:8px">${t('Cancel')}</button></div>`;
    s.onclick = async ev => { const b = ev.target.closest('button'); if (!b && ev.target !== s) return; s.remove(); if (b && b.dataset.y){ for (const x of ph) await dbDel('photos', x.id); await dbDel('points', id); await refresh(); show('vWork'); } };
    document.body.appendChild(s); }; }

/* ===================== share as a file (test mode) ===================== */
const CRC = (() => { const tb = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c >>> 0; } return u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = tb[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }; })();
function makeZip(files){ const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  for (const f of files){ const nm = enc.encode(f.name), crc = CRC(f.data), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint32(14,crc,true); h.setUint32(18,f.data.length,true); h.setUint32(22,f.data.length,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint32(16,crc,true); c.setUint32(20,f.data.length,true); c.setUint32(24,f.data.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer), nm); off += 30 + nm.length + f.data.length; }
  const cs = cen.reduce((a,b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(cen, [new Uint8Array(e.buffer)]), {type:'application/zip'}); }
function toFeature(p, names){ return {type:'Feature', geometry:{type:'Point', coordinates:[p.lon,p.lat]}, properties:{id:p.id, city:p.city, time:new Date(p.time).toISOString(), state:p.state, side:p.side === 'L' ? 'left' : p.side === 'R' ? 'right' : null,
  flow_bearing:p.state === 'flow' ? p.bearing : null, phone_bearing:p.bearing, from_compass:p.compass, flow_along_road:p.along, road_index:p.road, road_type:p.roadType, road_distance_m:p.roadDist, road_file:p.roadV, on_mapped_road:p.road != null,
  gps_lat:p.gps.lat, gps_lon:p.gps.lon, accuracy_m:p.gps.acc, gps_readings:p.gps.n, low_accuracy:p.lowAcc, drain_type:p.dtype, problems:p.problems, surveyor:p.surveyor, phone:p.phone, photos:names}}; }
async function shareZip(points, tag){ if (!points.length) return toast(t('Nothing to share')); const files = [], feats = [];
  for (const p of points){ const ph = await photosOf(p.id), names = [];
    for (const x of ph){ const nm = `photos/${p.id}_${x.n+1}.jpg`; names.push(nm); files.push({name:nm, data:new Uint8Array(await x.blob.arrayBuffer())}); } feats.push(toFeature(p, names)); }
  files.unshift({name:'captures.geojson', data:new TextEncoder().encode(JSON.stringify({type:'FeatureCollection', features:feats}, null, 1))});
  const name = `iuswdmp_${CITY.id}_${USER.phone.slice(-4)}_${tag}.zip`, blob = makeZip(files), file = new File([blob], name, {type:'application/zip'});
  try { if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast(t('File ready')); }

/* ===================== upload (used when the upload service address is set) ===================== */
let syncing = false;
async function sync(quiet){ if (!API || syncing || !navigator.onLine || !USER) { if (API && !quiet && !navigator.onLine) toast(t('No signal')); return; } syncing = true;
  try { for (const p of POINTS.filter(x => x.status === 'saved')){ const ph = await photosOf(p.id);
      const r = await fetch(API+'/points',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+USER.token},body:JSON.stringify(toFeature(p, ph.map(x => x.id)))}); if (!r.ok) throw new Error('point');
      const up = (await r.json()).uploads || {};
      for (const x of ph){ const u = up[x.id]; if (!u) continue; const pr = await fetch(u,{method:'PUT',headers:{'x-ms-blob-type':'BlockBlob','Content-Type':'image/jpeg'},body:x.blob}); if (!pr.ok) throw new Error('photo'); }
      const done = await fetch(API+'/points/'+p.id+'/done',{method:'POST',headers:{'Authorization':'Bearer '+USER.token}}); if (!done.ok) throw new Error('done');
      p.status = 'uploaded'; await dbPut('points', p); }
    if (!quiet) toast(t('All uploaded')); } catch(e){ if (!quiet) toast(t('Upload failed. Will try again.')); }
  syncing = false; await refresh(); if (view === 'vWork') renderWork(); }

/* ===================== start ===================== */
let started = false;
async function startApp(){ $('#login').hidden = true; $('#app').hidden = false;
  if (!started){ started = true; initMap(); startGPS(); startCompass(); await loadRoads(); await refresh();
    $('#back').onclick = () => show('vWork');
    document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { startCompass(); show(b.dataset.v); });
    window.addEventListener('online', () => { netUI(); sync(true); }); window.addEventListener('offline', netUI); setInterval(() => sync(true), 120000);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }
  applyLang(); show('vCap'); }
document.addEventListener('click', e => { const b = e.target.closest('.lang button'); if (!b) return; LANG = b.dataset.l; try { localStorage.setItem('fs_lang', LANG); } catch(err){} applyLang(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (USER) startApp(); else { document.documentElement.lang = LANG; renderLogin(); }
</script>
