<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a2a66">
<meta name="description" content="Integrated Urban Storm Water Drainage Master Plans (IUSWDMP) for Urban Local Bodies in Uttar Pradesh">
<meta property="og:type" content="website">
<meta property="og:title" content="IUSWDMP Portal · Uttar Pradesh">
<meta property="og:description" content="Integrated Urban Storm Water Drainage Master Plans for Lucknow, Prayagraj, Kanpur, Varanasi, Jhansi and Ayodhya.">
<title>IUSWDMP Portal · Uttar Pradesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#0a2a66;--blue:#1565c0;--sky:#e8f2fb;--red:#d32027;--green:#0b7d6e;--txt:#16233a;--mut:#62708a;--line:#d9e2ee;--card:#fff;--bg:#f5f8fc;
--sans:"Poppins","Noto Sans Devanagari",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);line-height:1.5}
a{color:var(--blue)}
img{max-width:100%}
/* header */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px rgba(10,42,102,.06)}
.row1{display:flex;align-items:center;gap:12px;padding:6px 18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);flex:1;min-width:0}
.brand img{height:42px;width:42px;border-radius:50%;object-fit:cover}
.brand b{display:block;font-size:15px;letter-spacing:1px;font-weight:800;line-height:1.1}
.brand small{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logos{display:flex;align-items:center;gap:10px}
.logos img{height:40px;width:auto;object-fit:contain}
.nav{display:flex;gap:6px;align-items:center;padding:0 14px 8px;overflow-x:auto;scrollbar-width:thin}
.nav a{flex:none;text-decoration:none;color:var(--navy);font-size:11.5px;font-weight:600;line-height:1.15;text-align:center;padding:6px 10px;border:1.5px solid var(--line);border-radius:7px;background:#fff;transition:.15s}
.nav a:hover{border-color:var(--blue);background:var(--sky)}
.nav a.on{border-color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset;color:var(--red)}
.nav .csel{flex:none;display:flex;align-items:center;gap:6px;margin:0 4px;padding-left:10px;border-left:2px solid var(--line)}
.nav .csel span{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.nav select{font:600 12px var(--sans);color:#fff;background:var(--navy);border:0;border-radius:7px;padding:7px 8px}
/* landing */
.land{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:linear-gradient(115deg,#fff 50%,#e3f1fb)}
.land .l{padding:5vh 6vw;display:flex;flex-direction:column;justify-content:center;gap:16px}
.dept{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mut)}
.dept img{height:56px;width:56px;border-radius:50%}
.dept b{display:block;color:var(--green);font-size:15px}
.land h1{margin:0;color:var(--navy);font-weight:800;line-height:1.2}
.land h1 .hi{display:block;font-size:clamp(28px,4.2vw,50px)}
.land h1 .en{display:block;font-size:clamp(19px,2.4vw,29px);color:var(--txt);margin-top:10px}
.land h1 small{display:block;font-size:14px;font-weight:500;color:var(--mut);margin-top:6px}
.enter{display:inline-flex;flex-direction:column;align-items:center;background:var(--green);color:#fff;text-decoration:none;border-radius:99px;padding:11px 34px;font-weight:700;font-size:17px;box-shadow:0 8px 20px rgba(11,125,110,.3);transition:.15s;width:max-content}
.enter small{font-weight:500;font-size:12px}
.enter:hover{transform:translateY(-2px)}
.org{font-size:13px}.org b{display:block;font-size:17px;color:var(--navy);letter-spacing:.5px}
.org .ta{margin-top:8px;font-size:12px;color:var(--mut)}.org .ta strong{color:var(--blue)}
.land .r{background:center/cover no-repeat;min-height:240px;border-radius:0 0 0 80px}
.landlogos{display:flex;gap:14px;align-items:center}.landlogos img{height:46px}
@media(max-width:850px){.land{grid-template-columns:1fr;min-height:0}.land .r{order:-1;border-radius:0}}
/* generic page */
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 44px}
.band{background:linear-gradient(100deg,#0a2a66,#1565c0);color:#fff;padding:16px 20px}
.band .in{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.band small{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}
.band h1{margin:2px 0 0;font-size:clamp(19px,2.4vw,26px);font-weight:700}
.band h1 span{font-weight:500;opacity:.9}
.band .pill{background:#fff;color:var(--navy);border-radius:99px;padding:5px 16px;font-weight:700;font-size:13px}
h2{color:var(--navy);font-size:18px;margin:26px 0 10px}
.lead{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{margin:0 0 6px;color:var(--navy);font-size:15px}
.card p{margin:0;font-size:13.5px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.lbar{border-left:4px solid var(--blue)}
.todo{border:2px dashed #c9d6e6;background:#fbfdff;border-radius:12px;padding:18px;text-align:center;color:var(--mut);font-size:13.5px}
.todo b{display:block;color:var(--navy);margin-bottom:2px}
.stat span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.stat b{font-size:26px;color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums}
.stat b small{font-size:12px;color:var(--mut);font-weight:500;margin-left:4px}
.note{font-size:12px;color:var(--mut);margin-top:10px}
/* cities */
.cities{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.cities{grid-template-columns:1fr}}
.upmap{background:linear-gradient(160deg,#eef6fd,#fff);border:1px solid var(--line);border-radius:14px;padding:8px}
.upmap svg{display:block;width:100%;height:auto}
.upmap .st{fill:#fff;stroke:#8a9bb5;stroke-width:3;filter:drop-shadow(0 6px 10px rgba(10,42,102,.12))}
.upmap .pin{cursor:pointer}
.upmap .pin .halo{fill:var(--red);opacity:.18;transition:.2s}
.upmap .pin .dot{fill:var(--red);stroke:#fff;stroke-width:5}
.upmap .pin.live .dot{fill:var(--green)}.upmap .pin.live .halo{fill:var(--green)}
.upmap .pin text{font:700 46px var(--sans);fill:var(--red);paint-order:stroke;stroke:#fff;stroke-width:9px}
.upmap .pin.live text{fill:var(--green)}
.upmap .pin:hover .halo{opacity:.4}
.key{background:#fff;border:2px solid var(--red);border-radius:12px;padding:10px 16px;text-align:center;margin-bottom:14px}
.key b{display:block;font-size:26px;color:var(--red);font-weight:800;line-height:1.1}
.key span{font-weight:700;color:var(--navy);font-size:13px;letter-spacing:.5px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--navy);color:#fff;font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--sky)}
tfoot td{font-weight:700;background:var(--navy);color:#fff}
.badge{font-size:10.5px;padding:2px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
.badge.live{background:#e5f5ef;border-color:#9fd3c4;color:var(--green)}
.badge.wait{background:#fff4e0;border-color:#f0cf97;color:#8a5a0b}
.legendrow{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legendrow i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
/* map stage */
.stage{position:relative;height:640px;background:#e4eaf2;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#cityMap{position:absolute;inset:0}
.panel{position:absolute;top:12px;bottom:12px;width:262px;background:#fff;border:1px solid var(--line);border-radius:10px;z-index:500;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(10,42,102,.1)}
.panel.left{left:12px}.panel.right{right:12px;width:290px}
.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ph h2{font-size:16px;margin:0}
.ph .k{font-family:var(--mono);font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.fs{border:0;background:none;cursor:pointer;color:var(--mut);font-size:15px}
.pb{overflow:auto;padding:8px 14px;flex:1}
.sec{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:12px 2px 6px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info div{border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.info span{font-family:var(--mono);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.info b{display:block;font-family:var(--mono);font-size:16px}
.layer{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:6px}
.layer:hover{background:var(--sky)}
.ic{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font-size:10px;flex:none}
.lt{flex:1;min-width:0}
.lt b{display:block;font-size:12px;font-weight:600}
.lt small{font-family:var(--mono);font-size:9px;color:var(--mut)}
.tag{font-family:var(--mono);font-size:7.5px;border:1px solid var(--line);padding:0 3px;border-radius:2px;margin-left:5px;color:var(--mut);vertical-align:middle}
.tg{appearance:none;-webkit-appearance:none;width:26px;height:14px;border-radius:99px;background:#cfd8e3;position:relative;cursor:pointer;flex:none;transition:.2s;margin:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.2s}
.tg:checked{background:var(--green)}.tg:checked::after{left:14px}
.tg:disabled{opacity:.4;cursor:not-allowed}
.basemap{padding:10px 14px 12px;border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;font:600 11px var(--sans);padding:6px;border-radius:4px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}
.wprrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--mut);padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.wprrow b{color:var(--txt)}
.pc{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:7px;padding:9px 12px;margin-bottom:8px;background:#fff}
.pc .t{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
.pc .t>span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:middle}
.pct{font-family:var(--mono);font-size:12px;color:var(--c)}
.nums{display:grid;grid-template-columns:1fr 1fr;margin-top:6px}
.nums.three{grid-template-columns:1fr 1fr 1fr}
.nums .l{font-family:var(--mono);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.nums .big{font-family:var(--mono);font-size:17px;font-weight:700}
.nums .est{font-family:var(--mono);font-size:13px;margin-top:3px}
.nums small{font-size:8px;color:var(--mut);font-weight:400}
.pbar{height:3px;background:#e8edf3;border-radius:9px;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c)}
.pt td{font-size:11px;padding:1px 8px 1px 0;vertical-align:top;border:0}
.pt td:first-child{color:var(--mut)}
/* measures */
.sol{border-radius:16px;padding:16px;text-align:center;font-size:13px}
.sol .n{display:inline-block;background:#fff;border-radius:99px;padding:4px 14px;font-weight:700;font-size:12px;margin-bottom:8px}
.sol h3{margin:0 0 6px;font-size:14.5px;color:var(--red)}
.opt{padding:0;overflow:hidden}
.opt img{width:100%;height:185px;object-fit:cover;display:block}
.opt .b{padding:12px 16px}
.opt h3{display:flex;gap:8px;align-items:center}
.opt .no{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700}
.opt .c{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px}
.opt .c b{color:var(--navy)}
.step{display:flex;gap:12px;margin:10px 0;font-size:13.5px}
.step .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
footer{text-align:center;font-size:11.5px;color:var(--mut);padding:16px;border-top:1px solid var(--line);background:#fff}
@media(max-width:900px){
 .stage{height:auto;border:0;background:none;overflow:visible}
 #cityMap{position:relative;height:60vh;border-radius:12px}
 .panel{position:relative;inset:auto;width:auto!important;margin:12px 0}
 .pb{overflow:visible}
 .logos img{height:30px}.brand small{display:none}
}
/* header v2 */
.row1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.org1{display:flex;align-items:center;gap:9px;min-width:0}
.org1 img{height:44px;width:auto;object-fit:contain;flex:none}
.org1 b{display:block;font-size:13.5px;color:var(--navy);line-height:1.2;font-weight:700}
.org1 small{display:block;font-size:10.5px;color:var(--mut)}
.org1.end{justify-content:flex-end;text-align:right}
@media(max-width:900px){.org1 div{display:none}.org1 img{height:34px}}
/* landing art */
.land .r{background:linear-gradient(160deg,#061a40,#0d47a1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vh 2vw;min-height:300px}
.land .r svg{width:100%;max-height:76vh;display:block}
.land .r text{font:700 46px var(--sans);fill:#fff}
.land .cap{color:#cfe8ff;font-size:14px;text-align:center;margin-top:6px}
.land .cap b{color:#fff}
.rip{fill:none;stroke:#7fd4ff;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:rip 3.2s ease-out infinite}
.rip.d2{animation-delay:1.6s}
.flow{fill:none;stroke:#7fd4ff;stroke-width:5;stroke-dasharray:14 18;stroke-linecap:round;opacity:.65;animation:flow 2.5s linear infinite}
@keyframes rip{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-64}}
@media(prefers-reduced-motion:reduce){.rip,.flow{animation:none}}
/* ---- city console layout ---- */
.nav select{font:600 12.5px var(--sans);color:#fff;background:var(--navy);border:0;border-radius:7px;padding:8px 10px;min-width:170px;cursor:pointer}
.proj{display:flex;align-items:center;gap:14px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.proj .bk{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--navy);font-size:17px;flex:none}
.proj h1{margin:0;font-size:19px;color:var(--navy);line-height:1.15;font-weight:700}
.proj small{color:var(--mut);font-size:11.5px}
.pills{display:flex;gap:8px;margin:0 auto;flex-wrap:wrap}
.pill2{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;background:#fff}
.pill2 i{display:block;width:62px;height:4px;border-radius:9px;background:#e8edf3;overflow:hidden}
.pill2 i b{display:block;height:100%;background:#16a34a}
.pill2 strong{font-family:var(--mono);font-size:12px}
.status{background:#6d28d9;color:#fff;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600}
.status.wait{background:#b45309}
.ws{position:relative;min-height:560px;background:#dfe6ee;overflow:hidden}
.side{position:absolute;left:0;top:0;bottom:0;width:76px;background:#0d1f3c;z-index:600;display:flex;flex-direction:column;padding:6px 0;overflow-y:auto;scrollbar-width:none}
.side a,.side button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;font:600 10px var(--sans);color:#b8c7dd;text-align:center;border-left:3px solid transparent}
.side svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side a.on{background:#16335f;color:#fff;border-left-color:#38bdf8}
.side a:hover,.side button:hover{color:#fff}
.side a:focus-visible,.side button:focus-visible{outline:2px solid #38bdf8;outline-offset:-2px}
.side .sl{font:500 8.5px var(--mono);letter-spacing:1.2px;color:#6f84a6;text-align:center;margin:8px 0 2px}
.mapbox{position:absolute;left:76px;top:0;right:0;bottom:0}
.ws #cityMap{position:absolute;inset:0;height:auto;border-radius:0}
.tools{position:absolute;right:12px;top:12px;z-index:550;display:flex;flex-direction:column;gap:8px}
.tools button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:17px;color:var(--navy);box-shadow:0 2px 8px rgba(10,42,102,.14)}
.tools button.on{background:var(--navy);color:#fff}
.langsw{flex:none;display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.langsw button{border:0;background:none;padding:5px 11px;font:600 11.5px var(--sans);color:var(--navy);cursor:pointer}
.langsw button.on{background:var(--navy);color:#fff}
.nav .langsw{margin-left:auto;position:sticky;right:0;box-shadow:-10px 0 10px #fff}
html[lang="hi"] .land .enter small,html[lang="hi"] .land h1 .en{display:none}
.land{position:relative}.land>.langsw{position:absolute;top:14px;right:16px;z-index:5}
.sw{display:inline-block;width:7px;height:7px;border-radius:2px;margin:0 3px 0 6px;vertical-align:middle}
.gsearch{position:absolute;top:12px;left:362px;width:270px;max-width:calc(100% - 440px);z-index:565}
.gsearch .gb{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 11px;height:38px;box-shadow:0 2px 8px rgba(10,42,102,.14)}
.gsearch .gb:focus-within{border-color:var(--navy)}
.gsearch svg{width:16px;height:16px;flex:none;color:#64748b}
.gsearch input{flex:1;min-width:0;border:0;outline:0;font:500 13px var(--sans);color:var(--navy);background:none}
.gsearch .gb small{font:500 10px var(--mono,monospace);color:#64748b;white-space:nowrap}
.gslist{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(10,42,102,.16);overflow:hidden}
.gslist[hidden]{display:none}
.gslist button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid #eef2f7;background:#fff;padding:8px 12px;font:500 12.5px var(--sans);color:var(--navy);cursor:pointer;text-align:left}
.gslist button:hover,.gslist button.sel{background:#eef4fb}
.gslist button span{color:#64748b;font:500 11.5px var(--mono,monospace)}
.gslist small{display:block;padding:7px 12px;color:#64748b;font:500 11px var(--sans)}
@media(max-width:900px){.gsearch{left:10px;width:auto;right:60px;max-width:none}}
.flowln{animation:flowmv 1.1s linear infinite}
@keyframes flowmv{to{stroke-dashoffset:-16}}
.flowar i{display:block;width:0;height:0;margin:1px auto 0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:14px solid #06b6d4;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #0b3a66)}
@media(prefers-reduced-motion:reduce){.flowln{animation:none}}
.tools button svg{width:18px;height:18px;vertical-align:middle}
.mapbox.measuring .leaflet-container{cursor:crosshair}

.mres select{margin-left:auto}
.mres .mx{border:0;padding:2px 6px;font-size:15px;line-height:1}

.lpanel{position:absolute;left:88px;top:12px;bottom:calc(44% + 12px);width:262px;z-index:560;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(10,42,102,.12)}
.lpanel[hidden]{display:none}
.ws.s-min .lpanel{bottom:62px}
.ws.s-max .lpanel{display:none}
.sheet{position:absolute;left:88px;right:12px;bottom:0;height:44%;z-index:570;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(10,42,102,.14);transition:height .2s}
.ws.s-min .sheet{height:48px}
.ws.s-max .sheet{height:calc(100% - 12px)}
.stabs{display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:thin}
.stabs a{flex:none;text-decoration:none;color:var(--mut);font-size:12.5px;font-weight:600;padding:14px 12px 11px;border-bottom:2px solid transparent;white-space:nowrap}
.stabs a.on{color:var(--navy);border-bottom-color:var(--blue)}
.stabs .sx{margin-left:auto;display:flex;gap:2px;flex:none;position:sticky;right:0;background:#fff;padding-left:8px}
.stabs .sx button{border:0;background:none;cursor:pointer;font-size:15px;color:var(--mut);padding:6px 8px}
.sbody{overflow:auto;padding:16px 18px 24px;flex:1}

.sbody>.lead:first-child,.sbody>div>h2:first-child{margin-top:0}

 .ws{height:auto!important;min-height:0;overflow:visible;display:flex;flex-direction:column}

async function loadData(c,d){
  const key = c.id+'/'+d.id;
  if (key in cache) return cache[key];
  const feats = []; let found = false;
  for (const f of (d.files || [d.file])){          // a layer can combine several files
    try{
      const r = await fetch(c.prefix + f, {cache:'no-cache'});
      if(!r.ok) continue;
      feats.push(...((await r.json()).features || [])); found = true;
    }catch(e){}
  }
  cache[key] = found ? {type:'FeatureCollection', features:feats} : null;
  return cache[key];
}
function popupHtml(d,p){
  const rows = Object.entries(p).filter(([k,v]) => k[0]!=='_' && v!==null && v!=='' && typeof v!=='object').slice(0,12)
    .map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  const ph = Array.isArray(p.photos) ? p.photos : [];
  const pics = ph.length ? `<a href="${ph[0]}" target="_blank" rel="noopener"><img src="${ph[0]}" alt="Photo of ${p.Point||d.name}" loading="lazy" style="max-width:240px;max-height:min(270px,30vh);min-height:110px;display:block;margin:6px auto 4px;border-radius:5px;background:#eef2f7"></a>`
    + (ph.length>1 ? `<div style="font-size:11px">More photos: ${ph.slice(1).map((f,i)=>`<a href="${f}" target="_blank" rel="noopener">${i+2}</a>`).join(' · ')}</div>` : '') : '';
  return `<b>${p.Point||p["Drain ID"]||(p.Culvert?"Culvert "+p.Culvert:"")||(p["Ward No"]?"Ward "+p["Ward No"]+(p.Ward?" · "+p.Ward:""):"")||d.name}</b>${pics}<table class="pt">${rows}</table>`;
}
const RAMP = [[37,99,235],[22,163,74],[234,179,8],[194,65,12]];   // low (blue) → high (brown)
function rampColor(t){
  t = Math.max(0,Math.min(1,t)) * (RAMP.length-1); const i = Math.min(RAMP.length-2,Math.floor(t)), f = t-i;
  return 'rgb(' + RAMP[i].map((v,k)=>Math.round(v+(RAMP[i+1][k]-v)*f)).join(',') + ')';
}
const BASIN_COL = ['#2a78d6','#eb6834','#1baf7a','#e87ba4','#6250d6','#eda100'];
function buildLayer(d,gj){
  if (d.flow){   // animated dashes that travel downstream, with arrowheads along each drain
    const fs = gj.features.filter(f => f.geometry.type==='LineString' && f.properties._flow), g = L.featureGroup(), arrows = L.layerGroup();
    const my = la => Math.log(Math.tan(Math.PI/4 + la*Math.PI/360)) * 180/Math.PI;
    fs.forEach(f => { const c = f.geometry.coordinates, ll = c.map(p => [p[1],p[0]]);
      L.polyline(ll,{color:'#0b3a66',weight:5,opacity:.55,interactive:false}).addTo(g);
      const ln = L.polyline(ll,{color:'#67e8f9',weight:3,opacity:1,dashArray:'2 14',lineCap:'round',className:'flowln'}).addTo(g);
      ln.bindPopup(popupHtml(d,f.properties));
      const cum = [0]; for (let i = 1; i < ll.length; i++) cum.push(cum[i-1] + L.latLng(ll[i-1]).distanceTo(ll[i]));
      const tot = cum[cum.length-1], n = Math.max(1, Math.round(tot/700));
      for (let k = 0; k < n; k++){ const at = tot*(k+.5)/n; let i = 1; while (i < cum.length-1 && cum[i] < at) i++;
        const a = ll[i-1], b = ll[i], ang = Math.atan2(b[1]-a[1], my(b[0])-my(a[0])) * 180/Math.PI;
        L.marker([(a[0]+b[0])/2,(a[1]+b[1])/2],{interactive:false,keyboard:false,icon:L.divIcon({className:'flowar',html:`<i style="transform:rotate(${ang.toFixed(0)}deg)"></i>`,iconSize:[18,18],iconAnchor:[9,9]})}).addTo(arrows); } });
    const upd = () => { const m = g._map; if (!m) return; m.getZoom() >= 13 ? g.addLayer(arrows) : g.removeLayer(arrows); };
    g.on('add', () => { g._map.on('zoomend', upd); upd(); }); g.on('remove', e => { e.target._mapToRemove && e.target._mapToRemove.off('zoomend', upd); });
    gj = {features:fs}; d._n = fs.length; return g;
  }
  let lo = 0, hi = 1;
  if (d.ramp){ const v = gj.features.map(f=>f.properties[d.ramp]).filter(x=>x!=null); lo = Math.min(...v); hi = Math.max(...v); d._range = [lo,hi]; }
  const lines = L.geoJSON(gj,{
    renderer: d.canvas ? L.canvas({padding:0.3}) : undefined,
    style: f => d.colorBy ? {color:(d.colors||{})[f.properties[d.colorBy]] || d.color, weight:(d.widths||{})[f.properties[d.colorBy]] || 1.4, opacity:.92}
                       : d.ramp ? {color:rampColor((f.properties[d.ramp]-lo)/((hi-lo)||1)), weight:(f.properties[d.ramp]%(d.major||5)===0)?2.4:1.1, opacity:.9}
                       : d.basins ? {color:BASIN_COL[gj.features.indexOf(f)%BASIN_COL.length], weight:2, fillOpacity:.22}
                       : d.id==='streams' ? {color:'#0e7490', weight:0.6+(f.properties['Stream order']-3)*0.75, opacity:.9}
                       : d.id==='catchment' ? (f.geometry.type==='Polygon' ? {color:'#0369a1',weight:2,dashArray:'7 5',fillColor:'#38bdf8',fillOpacity:.05}
                                                                           : {color:'#0284c7',weight:1+(f.properties['Stream order']||1)*0.9,opacity:.85})
                       : (d.style || {color:d.color,weight:2}),
    pointToLayer: (f,ll) => L.circleMarker(ll,{radius:d.radius||5,color:'#fff',weight:1.5,fillColor:d.pointColor||d.color,fillOpacity:1}),
    onEachFeature: (f,l) => { if (f.properties && Object.keys(f.properties).length) l.bindPopup(popupHtml(d,f.properties));
      if (d.id==='ward'){ l.on('mouseover',()=>l.setStyle({weight:3,fillOpacity:.18})); l.on('mouseout',()=>lines.resetStyle(l)); l.on('popupopen',()=>l.setStyle({weight:3,fillOpacity:.25})); l.on('popupclose',()=>lines.resetStyle(l)); }
      if (d.basins) l.bindTooltip(`${f.properties.Basin}<br>${f.properties['Area (sq km)']} sq km`,{permanent:true,direction:'center',className:'blab'}); }
  });
  if (!d.ramp) return lines;
  // contour layers: elevation labels along the lines (major levels from zoom 13, every level from zoom 15)
  const labels = L.layerGroup();
  gj.features.forEach(f => { const lev = f.properties[d.ramp], major = lev%(d.major||5)===0;
    (f.geometry.type==='MultiLineString' ? f.geometry.coordinates : [f.geometry.coordinates]).forEach(ln => {
      if (ln.length < 14) return; const pt = ln[Math.floor(ln.length/2)];
      labels.addLayer(L.marker([pt[1],pt[0]],{interactive:false,keyboard:false,icon:L.divIcon({className:'clab'+(major?' mj':''),html:String(lev),iconSize:null})})); }); });
  const grp = L.featureGroup([lines]);
  const upd = () => { const m = grp._map; if(!m) return; const z = m.getZoom();
    z >= 13 ? grp.addLayer(labels) : grp.removeLayer(labels); m.getContainer().classList.toggle('lab-all', z >= 15); };
  grp.on('add', () => { grp._map.on('zoomend', upd); upd(); });
  grp.on('remove', e => { e.target._mapToRemove && e.target._mapToRemove.off('zoomend', upd); });
  return grp;
}

const UNITS_HI = {blocks:'ब्लॉक',drains:'नाले',wards:'वार्ड',boundary:'सीमा',polygons:'बहुभुज',features:'आकृतियाँ',basins:'बेसिन','stream orders':'धारा क्रम',levels:'स्तर',points:'बिंदु',photos:'फोटो','sq km':'वर्ग किमी',km:'किमी',m:'मी'};
let LANG = 'en'; try{ if (localStorage.getItem('iuswdmp_lang') === 'hi') LANG = 'hi'; }catch(e){}
const cityHi = n => { const c = CONFIG.cities.find(x => x.name === n); return c ? c.hi : n; };
const CITY_RE = () => CONFIG.cities.map(c=>c.name).join('|');
const HI_PAT = [
  [/^(\d+) m DEM(.*)$/, m => `${m[1]} मी डीईएम${m[2].replace(/ m$/,' मी')}`],
  [/^© (\d+) .*$/, m => `© ${m[1]} कंस्ट्रक्शन एंड डिज़ाइन सर्विसेज़, उत्तर प्रदेश जल निगम (नगरीय) · तकनीकी सहयोगी: एनसीपीई इन्फ्रास्ट्रक्चर इंडिया प्राइवेट लिमिटेड`],
  [/^Technical Associate: NCPE.*$/, m => 'तकनीकी सहयोगी: एनसीपीई इन्फ्रास्ट्रक्चर इंडिया प्राइवेट लिमिटेड'],
  [/^([\d,.]+) (wards|boundary|polygons|features|basins|stream orders|levels|points|photos|drains|blocks|sq km|km|m)\b(.*)$/, m => `${m[1]} ${UNITS_HI[m[2]]}${m[3].replace(/ m$/,' मी').replace('locations','स्थान')}`],
  [/^Ramnagar block(.*)$/, m => `रामनगर ब्लॉक${m[1].replace('cm','सेमी')}`],
  [/^SOI toposheet(.*)$/, m => `एसओआई टोपोशीट${m[1]}`],
  [/^(\d+)-year( storm)?$/, m => `${m[1]}-वर्षीय${m[2]?' वर्षा':''}`],
  [/^(.+) Municipal Corporation · ([\d,.]+) sq km$/, m => `${cityHi(m[1])} नगर निगम · ${m[2]} वर्ग किमी`],
  [/^IDF curves for (.+)$/, m => `${cityHi(m[1])} के आईडीएफ वक्र`],
  [/^Intensity–Duration–Frequency \(IDF\) curves for (.+), used to select.*$/, m => `${cityHi(m[1])} के तीव्रता–अवधि–आवृत्ति (आईडीएफ) वक्र, जिनसे किसी वर्षा अवधि और पुनरावृत्ति अवधि के लिए डिज़ाइन वर्षा तीव्रता चुनी जाती है।`],
  [/^Concept options from the project presentation\. City-specific proposals for (.+) will follow the master plan\.$/, m => `परियोजना प्रस्तुति के संकल्पनात्मक विकल्प। ${cityHi(m[1])} के लिए शहर-विशिष्ट प्रस्ताव मास्टर प्लान के बाद आएँगे।`],
  [/^Costs will be filled in once the estimates for (.+) are finalised\..*$/, m => `${cityHi(m[1])} के अनुमान अंतिम होने पर लागत भरी जाएगी। परियोजनाओं की प्राथमिकता, क्रियान्वयन के चरण और वित्तपोषण (एसडीएमएफ, राज्य, निकाय) मास्टर प्लान के अनुसार होंगे।`],
  [/^(.+): to be added$/, m => `${cityHi(m[1])}: जोड़ा जाना है`],
  [/^Ward (\d+)( · .*)?$/, m => `वार्ड ${m[1]}${m[2]||''}`],
  [/^Culvert (.+)$/, m => `पुलिया ${m[1]}`],
  [/^More photos:$/, m => 'और फोटो:'],
  [/^(\d+) (min)$/, m => `${m[1]} मिनट`],
  [/^([\d.]+) mm\/hr$/, m => `${m[1]} मिमी/घंटा`],
  [/^(\d+) of (\d+) points$/, m => `${m[2]} में से ${m[1]} बिंदु`],
  [/^· perimeter (.*)$/, m => `· परिमाप ${m[1]}`]
];
function hiOf(s){
  const t = s.replace(/\s+/g,' ').trim(); if (!t) return null;
  if (HI[t]) return HI[t];
  const c = CONFIG.cities.find(x => x.name === t); if (c) return c.hi;
  const e = t.match(/^(.*?)([.:])$/); if (e && HI[e[1]]) return HI[e[1]] + (e[2]==='.'?'।':':');
  for (const [re,fn] of HI_PAT){ const m = t.match(re); if (m) return fn(m); }
  return null;
}
const L_ORIG = new WeakMap(), L_ATTR = ['title','aria-label','placeholder','alt'];
function trText(n){
  const cur = n.nodeValue, o = L_ORIG.get(n);
  if (o && o.out === cur){ if (LANG==='en'){ n.nodeValue = o.src; L_ORIG.delete(n); } return; }
  if (LANG !== 'hi') return;
  const h = hiOf(cur); if (!h) return;
  const out = cur.match(/^\s*/)[0] + h + cur.match(/\s*$/)[0];
  L_ORIG.set(n,{src:cur,out}); n.nodeValue = out;
}
function trEl(el){
  if (!el.getAttribute) return;
  for (const a of L_ATTR){ const v = el.getAttribute(a); if (!v) continue; const key = '_l_'+a;
    if (el[key] && el[key].out === v){ if (LANG==='en'){ el.setAttribute(a, el[key].src); el[key] = null; } continue; }
    if (LANG==='hi'){ const h = hiOf(v); if (h){ el[key] = {src:v,out:h}; el.setAttribute(a,h); } } }
}
function trTree(root){
  if (root.nodeType === 3){ trText(root); return; }
  if (root.nodeType !== 1 || /^(SCRIPT|STYLE)$/.test(root.tagName)) return;
  trEl(root); root.querySelectorAll('[title],[aria-label],[placeholder],[alt]').forEach(trEl);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const ns = []; while (w.nextNode()) ns.push(w.currentNode); ns.forEach(trText);
}
function setLang(l){
  LANG = l; try{ localStorage.setItem('iuswdmp_lang', l); }catch(e){}
  document.documentElement.lang = l; trTree(document.body);
  document.querySelectorAll('.langsw button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
}
const langSw = () => `<span class="langsw" role="group" aria-label="Language"><button data-l="en" class="${LANG==='en'?'on':''}" lang="en">English</button><button data-l="hi" class="${LANG==='hi'?'on':''}" lang="hi">हिंदी</button></span>`;
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.langsw button'); if (b) setLang(b.dataset.l); });
new MutationObserver(ms => { if (LANG !== 'hi') return;
  for (const m of ms){ if (m.type === 'characterData') trText(m.target); else if (m.type === 'attributes') trEl(m.target); else m.addedNodes.forEach(trTree); }
}).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:L_ATTR});

/* ---------- GCP search (LiDAR Surveys tab) ---------- */
function gcpSearch(m, lyr, tg, pad){
  const inp = $('#gsIn'), list = $('#gsList'); if (!inp) return;
  const pts = []; lyr.eachLayer(l => { const p = l.feature && l.feature.properties; if (p && p.Point) pts.push({name:String(p.Point), key:String(p.Point).toLowerCase().replace(/[^a-z0-9]/g,''), num:parseInt(String(p.Point).replace(/\D/g,''))||0, el:p['Elevation (m)'], ph:Array.isArray(p.photos)&&p.photos.length, l}); });
  pts.sort((a,b) => a.name.replace(/[\d\s-]/g,'').localeCompare(b.name.replace(/[\d\s-]/g,'')) || a.num - b.num);
  inp.disabled = false; let hits = [], sel = -1;
  const go = h => { if (!h) return; if (!tg.checked){ tg.checked = true; tg.onchange(); }
    inp.value = h.name; list.hidden = true;
    m.flyTo(h.l.getLatLng(), Math.max(m.getZoom(),18), {duration:.8}); m.once('moveend', () => h.l.openPopup()); };
  const draw = () => { const q = inp.value.toLowerCase().replace(/[^a-z0-9]/g,''); sel = -1;
    if (!q){ list.hidden = true; return; }
    const rank = p => p.key === q ? 0 : (/^\d+$/.test(q) && p.num === +q) ? 1 : p.key.startsWith(q) ? 2 : p.key.includes(q) ? 3 : 9;
    const all = pts.map(p => [rank(p),p]).filter(x => x[0] < 9).sort((a,b) => a[0]-b[0]); hits = all.slice(0,8).map(x => x[1]);
    list.hidden = false;
    list.innerHTML = hits.length ? hits.map((h,i) => `<button data-i="${i}"><b>${h.name}</b><span>${h.el!=null ? h.el+' m' : ''}${h.ph ? ' · 📷' : ''}</span></button>`).join('') + (all.length > 8 ? `<small>${hits.length} of ${all.length} points</small>` : '') : '<small>No matching point</small>';
    list.querySelectorAll('button').forEach(b => b.onclick = () => go(hits[+b.dataset.i])); };
  inp.oninput = draw; inp.onfocus = draw;
  inp.onkeydown = e => { const bs = list.querySelectorAll('button');
    if (e.key === 'Enter'){ go(hits[sel < 0 ? 0 : sel]); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if (!bs.length) return; sel = (sel + (e.key==='ArrowDown'?1:-1) + bs.length) % bs.length; bs.forEach((b,i) => b.classList.toggle('sel', i===sel)); }
    else if (e.key === 'Escape'){ list.hidden = true; inp.blur(); e.stopPropagation(); } };
  document.addEventListener('click', e => { if (!e.target.closest || !e.target.closest('#gsearch')) list.hidden = true; });
  $('#gsCount').textContent = `${pts.length} points`;
}

/* JPG tiles have no transparency, so the blank area outside a survey block comes out white.
   This tile layer clears every white region that touches a tile edge, leaving the map visible around the block. */
const CutWhiteTiles = L.TileLayer.extend({
  createTile(coords, done){
    const c = document.createElement('canvas'), img = new Image(); img.crossOrigin = 'anonymous';
    const deep = coords.z >= (this.options.maxNativeZoom || 99);   // deepest level: only clear white that reaches a tile edge
    img.onload = () => { const w = c.width = img.naturalWidth, h = c.height = img.naturalHeight, g = c.getContext('2d'); g.drawImage(img,0,0);
      try{ const id = g.getImageData(0,0,w,h), p = id.data, st = new Int32Array(w*h), seen = new Uint8Array(w*h);
        const wh = i => p[i*4] > 243 && p[i*4+1] > 243 && p[i*4+2] > 243;
        let cut = false;
        if (deep){                                   // flood fill inwards from the four edges
          let n = 0;
          const push = i => { if (!seen[i] && wh(i)){ seen[i] = 1; st[n++] = i; } };
          for (let x = 0; x < w; x++){ push(x); push((h-1)*w + x); }
          for (let y = 0; y < h; y++){ push(y*w); push(y*w + w-1); }
          if (n) cut = true;
          while (n){ const i = st[--n], x = i % w; p[i*4+3] = 0;
            if (x > 0) push(i-1); if (x < w-1) push(i+1); if (i >= w) push(i-w); if (i < w*(h-1)) push(i+w); }
        } else {                                     // overview levels: also clear blank patches enclosed by imagery
          const buf = new Int32Array(w*h), MIN = (w*h)/900;
          for (let s = 0; s < w*h; s++){
            if (seen[s] || !wh(s)) continue;
            let n = 0, len = 0, edge = false; seen[s] = 1; st[n++] = s;
            while (n){ const i = st[--n]; buf[len++] = i; const x = i % w, y = (i/w)|0;
              if (x === 0 || y === 0 || x === w-1 || y === h-1) edge = true;
              if (x > 0 && !seen[i-1] && wh(i-1)){ seen[i-1] = 1; st[n++] = i-1; }
              if (x < w-1 && !seen[i+1] && wh(i+1)){ seen[i+1] = 1; st[n++] = i+1; }
              if (i >= w && !seen[i-w] && wh(i-w)){ seen[i-w] = 1; st[n++] = i-w; }
              if (i < w*(h-1) && !seen[i+w] && wh(i+w)){ seen[i+w] = 1; st[n++] = i+w; } }
            if (edge || len > MIN){ cut = true; for (let k = 0; k < len; k++) p[buf[k]*4+3] = 0; } }
        }
        if (cut) g.putImageData(id,0,0);
      }catch(e){}   // if the browser blocks pixel access the tile is shown as it is
      done(null, c); };
    const url = this.getTileUrl(coords);
    img.onerror = e => { if (img.crossOrigin === null){ done(e, c); return; }   // storage without the CORS rule: show the tile unprocessed
      img.removeAttribute('crossorigin'); img.crossOrigin = null; img.src = url; };
    img.src = url; return c; }
});

function progCard(p){
  const pc = (p.est && p.done!=null) ? Math.min(100, p.done/p.est*100) : null;
  return `<div class="pc" style="--c:${p.color}"><div class="t"><span>${p.name}</span>${pc!==null?`<span class="pct">${pc.toFixed(0)}%</span>`:''}</div>
    <div class="nums"><div><div class="l">Done</div><div class="big">${fmt(p.done)}<small> ${p.unit}</small></div></div>
    ${p.est?`<div><div class="l">Estimated</div><div class="est">${fmt(p.est)}<small> ${p.unit}</small></div></div>`:''}</div>
    ${pc!==null?`<div class="pbar"><i style="width:${pc}%"></i></div>`:''}</div>`;
}
/* ---------- IDF curves (chart + table drawn from the city's IDF relation) ---------- */
const IDF_COL = ['#2a78d6','#1baf6a','#eda100'];
const idfI = (f,T,t) => f.a * Math.pow(T,f.m) / Math.pow(t,f.n);
function idfBlock(c){
  const f = c.idf, W = 720, H = 400, L = 58, R = 92, T0 = 18, B = 46, tMax = 120, yMax = 240;
  const x = t => L + (W-L-R) * t / tMax, y = v => T0 + (H-T0-B) * (1 - v / yMax);
  const marks = [7.5,15,22.5,30,45,60,75,90,105,120];
  const rows = [7.5,15,22.5,30,45,60,75,90,105,120,135,150,165,180,195,210,225,240,255,270,285,300,315,330,345,360,420,480];
  let g = '';
  for (let v = 0; v <= yMax; v += 40) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e9f1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  for (let t = 0; t <= tMax; t += 15) g += `<text x="${x(t)}" y="${H-B+18}" text-anchor="middle">${t}</text>`;
  // end-of-line labels, pushed apart so they never overlap (lowest curve first)
  const lab = f.periods.map(T => y(idfI(f,T,tMax)));
  for (let i = 1; i < lab.length; i++) if (lab[i-1] - lab[i] < 15) lab[i] = lab[i-1] - 15;
  const curves = f.periods.map((T,i) => {
    let d = ''; for (let t = 7.5; t <= tMax + 0.01; t += 1.25) d += (d?'L':'M') + x(t).toFixed(1) + ' ' + y(idfI(f,T,t)).toFixed(1);
    const yEnd = lab[i];
    return `<path d="${d}" fill="none" stroke="${IDF_COL[i]}" stroke-width="2.2" stroke-linejoin="round"/>` +
      marks.map(t => `<circle cx="${x(t).toFixed(1)}" cy="${y(idfI(f,T,t)).toFixed(1)}" r="4" fill="${IDF_COL[i]}" stroke="#fff" stroke-width="2"/>`).join('') +
      `<text x="${W-R+10}" y="${yEnd+4}" class="dl">${T}-year</text>`;
  }).join('');
  return `<p class="lead">Intensity–Duration–Frequency (IDF) curves for ${c.name}, used to select the design rainfall intensity for a given storm duration and return period.</p>
  <div class="idf">
    <div class="card">
      <div class="idfhead"><h3>IDF curves for ${c.name}</h3>
        <div class="idfleg">${f.periods.map((T,i)=>`<span><i style="background:${IDF_COL[i]}"></i>${T}-year storm</span>`).join('')}</div></div>
      <div class="idfplot" id="idfPlot"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rainfall intensity against storm duration for ${f.periods.join(', ')}-year storms">
        ${g}<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#8a9bb5"/>
        <text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" class="ax">Duration (minutes)</text>
        <text transform="translate(14 ${(T0+H-B)/2}) rotate(-90)" text-anchor="middle" class="ax">Intensity (mm/hr)</text>
        ${curves}<line id="idfX" y1="${T0}" y2="${H-B}" stroke="#62708a" stroke-dasharray="3 3" visibility="hidden"/>
      </svg><div class="idftip" id="idfTip" hidden></div></div>
      <div class="formula"><b>I = ${f.a} × T<sup>${f.m}</sup> ÷ t<sup>${f.n}</sup></b><span>I = rainfall intensity (mm/hr) · T = return period (years) · t = storm duration (minutes)</span></div>
    </div>
    <div class="card idftable"><h3>Intensity table (mm/hr)</h3>
      <div class="tw"><table><thead><tr><th class="n">Duration (min)</th>${f.periods.map(T=>`<th class="n">${T}-year</th>`).join('')}</tr></thead>
      <tbody>${rows.map(t=>`<tr><td class="n">${t}</td>${f.periods.map(T=>`<td class="n">${idfI(f,T,t).toFixed(2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  </div>
  <p class="note">Curves and table are computed from the IDF relation shown under the chart. Hover over the chart to read values.</p>`;
}
function idfInit(c){
  const box = $('#idfPlot'); if (!box || !c.idf) return;
  const f = c.idf, svgEl = box.querySelector('svg'), tip = $('#idfTip'), line = $('#idfX');
  const W = 720, L = 58, R = 92, tMax = 120, marks = [7.5,15,22.5,30,45,60,75,90,105,120];
  const show = e => {
    const r = svgEl.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const t0 = (px - L) / (W-L-R) * tMax, t = marks.reduce((a,b)=>Math.abs(b-t0)<Math.abs(a-t0)?b:a);
    const lx = L + (W-L-R) * t / tMax;
    line.setAttribute('x1',lx); line.setAttribute('x2',lx); line.setAttribute('visibility','visible');
    tip.innerHTML = `<b>${t} min</b>` + f.periods.map((T,i)=>`<span><i style="background:${IDF_COL[i]}"></i>${T}-year<strong>${idfI(f,T,t).toFixed(2)} mm/hr</strong></span>`).join('');
    tip.hidden = false;
    const left = lx / W * r.width; tip.style.left = (left > r.width*0.6 ? left - tip.offsetWidth - 12 : left + 12) + 'px';
  };
  svgEl.addEventListener('pointermove', show); svgEl.addEventListener('pointerdown', show);
  svgEl.addEventListener('pointerleave', () => { tip.hidden = true; line.setAttribute('visibility','hidden'); });
}

      <tbody>${CONFIG.costLines.map((l,i)=>`<tr><td>${i+1}</td><td>${l}</td><td class="n">${fmt(v[i],2)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">GRAND TOTAL</td><td class="n">${any?fmt(tot,2):'—'}</td></tr></tfoot></table></div>
      <p class="note">Costs will be filled in once the estimates for ${c.name} are finalised. Prioritisation of projects, phasing of implementation and funding (SDMF, State, ULB) follow the master plan.</p></div>`;
    return {html};
  },
  progress(c){
    const right = `<div class="ph" style="display:block"><div class="k">Survey progress</div><h2>${c.name}</h2></div>
      <div class="pb"><div class="wprrow"><span>Latest WPR</span><b>${c.live?CONFIG.latestWPR:'—'}</b></div>
      ${CONFIG.progressTemplate.map(t=>{const v=(c.progress||{})[t.name]||[]; return progCard({...t,done:v[0],est:v[1]});}).join('')}
      <div class="pc" style="--c:#0a2a66"><div class="t"><span>Survey Team</span></div>
        <div class="nums three"><div><div class="l">Rovers</div><div class="big">${fmt(c.team&&c.team.rovers)}</div></div>
        <div><div class="l">Base</div><div class="big">${fmt(c.team&&c.team.base)}</div></div>
        <div><div class="l">Members</div><div class="big">${fmt(c.team&&c.team.members)}</div></div></div></div></div>`;
    return {ids:CONFIG.layers.filter(l=>!l.only).map(l=>l.id), right, search:true};
  },
  twin(c){
    const st=[["Survey integration and drainage inventory","Integrate drone LiDAR terrain data, high-resolution imagery, municipal records and field surveys in a common coordinate and elevation system. Map drains, culverts, inlets, outfalls, lakes, ponds, pumps and sluice gates with unique asset IDs."],
      ["Catchment analysis and flood assessment","Connect the spatial database to rainfall–runoff and drainage network models. Assess capacity, bottlenecks, backwater effects and flood pathways under agreed design storms and future development scenarios."],
      ["Testing and prioritising interventions","Compare drain rehabilitation, widening, alternate alignments, culvert improvements, pumping and lake regulation with detention ponds and other sponge city measures. Rank packages by flood reduction, cost and maintenance."],
      ["Master plan and DPR preparation","Establish catchment-wise proposals, alignments, indicative dimensions and phased investment priorities. Hand over editable GIS layers, model files, flood maps and an asset register."],
      ["Monitoring and operational readiness","Progressively connect rain gauges, drain and lake-level sensors, pump status and SCADA or command-centre systems to support threshold alerts and operator decisions."]];
    const html = `<div><p class="lead">A digital twin is proposed as an integrated platform for preparing, reviewing and regularly updating stormwater drainage master plans and Detailed Project Reports. It links geospatial data, hydrological and hydraulic models, and field observations.</p>
      <div class="grid g3"><div class="card"><h3>Integrated Spatial Data</h3><p>Combine terrain, drainage assets, land use and upstream catchments in a consistent geospatial database.</p></div>
      <div class="card"><h3>Flood Simulation and Planning</h3><p>Assess network capacity, identify flood hotspots and compare structural and sponge city interventions.</p></div>
      <div class="card"><h3>Monitoring and Decision Support</h3><p>Progressively connect rainfall and water-level observations to support alerts, asset management and operations.</p></div></div>
      <h2>How the model is applied</h2>${st.map((s,i)=>`<div class="step"><div class="no">${i+1}</div><div><b>${s[0]}.</b> ${s[1]}</div></div>`).join('')}
      <div class="card lbar" style="margin-top:14px"><h3>Implementation recommendation</h3><p>Begin with a validated planning model for each ULB, pilot priority catchments and expand monitoring in stages. Benefits depend on survey quality, validation and sustained upkeep.</p></div></div>`;

  }
};

function route(){
  clearMaps();
  const h = (location.hash || '#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  window.onresize = null;
  if (!h.length){ landing(); window.scrollTo(0,0); return; }
  let tab = h[0];
  if (tab === 'city'){
    const c = cityOf(h[1]) || cityOf(current);
    current = c.id; try{ localStorage.setItem('iuswdmp_city', current); }catch(e){}
    tab = (h[2]==='contour'||h[2]==='rainfall') ? 'analysis' : (PAGES[h[2]] ? h[2] : 'progress');
    chrome(true, tab); cityView(c, tab);
    document.title = `${TITLES[tab]} · ${c.name} · IUSWDMP`;
  } else if (tab === 'cities'){ chrome(true,'cities'); cities(); document.title = 'Cities · IUSWDMP'; }
  else { chrome(true,'about'); about(); document.title = 'About · IUSWDMP'; }
  window.scrollTo(0,0);
}
