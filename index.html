<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1f2a">
<meta name="description" content="Dashboard for survey progress – IUSWDMP Varanasi">
<title>Dashboard for Survey Progress · Varanasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#0b1f2a;--cream:#f3f1ea;--card:#fffdf8;--line:#e3dfd3;--txt:#14222b;--mut:#6b7a83;--teal:#1f7a74;--orange:#ea7a17;
--mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--cream);color:var(--txt)}
a{color:inherit}
.skip{position:absolute;left:-999px;top:8px;background:#2ec4b6;color:#000;padding:6px 10px;border-radius:6px;z-index:9999}
.skip:focus{left:8px}
/* header */
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:1000}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.logos{display:flex;align-items:center;gap:10px;background:#fff;border-radius:4px;padding:4px 10px;height:44px}
.logos img{height:36px;width:auto;max-width:90px;object-fit:contain;display:block}
.logos .sep{width:1px;height:28px;background:#d6d6d6}
.lb{color:var(--navy);font-size:12px}
.bt strong{display:block;font-size:13px;letter-spacing:1.5px;font-weight:800}
.bt small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:#8fa6b2;text-transform:uppercase}
.wpr{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:#b9c9d1;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.wpr::before{content:"";width:7px;height:7px;border-radius:50%;background:#2ec4b6;box-shadow:0 0 0 3px rgba(46,196,182,.25)}
/* home */
.hero{background:linear-gradient(100deg,#0e3a46 0%,#0b1f2a 55%,#1d2a2e 100%);color:#fff;padding:42px 24px 36px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px}
.wrap{max-width:1010px;margin:auto;position:relative}
.hero p{font-size:11px;color:#b9c9d1;margin:0 0 12px}
.hero h1{font-size:clamp(28px,3.6vw,42px);letter-spacing:-1.4px;margin:0;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:22px 0}
.ccard{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:6px;padding:10px 13px 12px;text-decoration:none;transition:.15s}
.ccard.all{border-top-color:var(--navy)}
.ccard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.arr{display:flex;justify-content:flex-end}
.arr span{width:20px;height:20px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--mut)}
.ccard h3{font-size:17px;margin:4px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:-.3px}
.lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--orange)}
.val{font-size:14px;font-weight:800;margin:1px 0 8px}
.val small{font-family:var(--mono);font-size:9px;color:var(--mut);font-weight:400}
#homeMap{height:440px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:40px}
.leaflet-tooltip.pin{background:#fff;border:1px solid #cfcfcf;border-radius:3px;font:600 10px var(--sans);padding:2px 6px;box-shadow:none}
.leaflet-tooltip.pin::before{display:none}
/* city */
.cityhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 20px 12px;background:#fff;border-bottom:1px solid var(--line)}
.back{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);text-decoration:none}
.cityhead h1{font-size:22px;margin:3px 0;letter-spacing:-.5px}
.cityhead h1 span{color:var(--mut);font-weight:600}
.sub{font-family:var(--mono);font-size:10px;color:var(--mut)}
select.sw{font:500 12px var(--sans);padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;min-width:160px}
.stage{position:relative;height:calc(100vh - 54px - 76px);min-height:600px;background:#e8e6df}
#cityMap{position:absolute;inset:0}
.panel{position:absolute;top:14px;bottom:14px;width:262px;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:500;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.panel.left{left:14px}.panel.right{right:14px;width:300px}
.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ph h2{font-size:17px;margin:0;letter-spacing:-.3px}
.ph .k{font-family:var(--mono);font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.fs{border:0;background:none;cursor:pointer;color:var(--mut);font-size:15px}
.pb{overflow:auto;padding:10px 14px;flex:1}
.sec{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:12px 2px 8px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info div{border:1px solid var(--line);border-radius:5px;padding:7px 10px;background:#fff}
.info span{font-family:var(--mono);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.info b{display:block;font-family:var(--mono);font-size:17px}
.layer{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:5px}
.layer:hover{background:#f1eee5}
.ic{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font-size:10px;flex:none}
.lt{flex:1;min-width:0}
.lt b{display:block;font-size:12px;font-weight:600}
.lt small{font-family:var(--mono);font-size:9px;color:var(--mut)}
.tag{font-family:var(--mono);font-size:7.5px;border:1px solid var(--line);padding:0 3px;border-radius:2px;margin-left:5px;color:var(--mut);vertical-align:middle}
.tg{appearance:none;-webkit-appearance:none;width:26px;height:14px;border-radius:99px;background:#d9d5ca;position:relative;cursor:pointer;flex:none;transition:.2s;margin:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.2s}
.tg:checked{background:var(--teal)}.tg:checked::after{left:14px}
.tg:disabled{opacity:.4;cursor:not-allowed}
.legend{display:flex;gap:12px;font-family:var(--mono);font-size:7.5px;text-transform:uppercase;color:var(--mut);background:#f1eee5;padding:5px 8px;border-radius:4px;margin:0 0 4px 36px}
.legend i{display:inline-block;width:12px;height:2px;margin-right:4px;vertical-align:middle}
.basemap{padding:10px 14px 14px;border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:5px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;font:600 11px var(--sans);padding:6px;border-radius:4px;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--txt)}
.wprrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--mut);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.wprrow b{color:var(--txt)}
.pc{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:10px 12px;margin-bottom:9px;background:#fff}
.pc .t{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
.pc .t>span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:middle}
.pct{font-family:var(--mono);font-size:12px;color:var(--c)}
.nums{display:grid;grid-template-columns:1fr 1fr;margin-top:8px}
.nums.three{grid-template-columns:1fr 1fr 1fr}
.nums .l{font-family:var(--mono);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.nums .big{font-family:var(--mono);font-size:18px;font-weight:700}
.nums .est{font-family:var(--mono);font-size:14px;margin-top:3px}
.nums small{font-size:8px;color:var(--mut);font-weight:400}
.pbar{height:3px;background:#eee;border-radius:9px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c)}
.pt td{font-size:11px;padding:1px 8px 1px 0;vertical-align:top}
.pt td:first-child{color:var(--mut)}
footer{text-align:center;font-family:var(--mono);font-size:10px;color:var(--mut);padding:14px;border-top:1px solid var(--line)}
@media(max-width:900px){
 .stage{height:auto;min-height:0}
 #cityMap{position:relative;height:62vh}
 .panel{position:relative;inset:auto;width:auto!important;margin:12px}
 .pb{overflow:visible}
 .top{padding:0 12px}.bt{display:none}
 .cityhead{flex-wrap:wrap}
}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>

<header class="top">
  <a class="brand" href="#/">
    <span class="logos">
      <img src="assets/logos/cds.jpg" alt="Construction & Design Services" onerror="this.outerHTML='<b class=lb>CDS</b>'">
      <span class="sep"></span>
      <img src="assets/logos/ncpe.jpg" alt="NCPE Consultancy" onerror="this.outerHTML='<b class=lb>NCPE</b>'">
    </span>
    <span class="bt"><strong>IUSWDMP</strong><small>Survey progress</small></span>
  </a>
  <span class="wpr" id="wprTag"></span>
</header>

<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
<script>
/* =================== EDIT THIS BLOCK (SAMPLE DATA) =================== */
const CONFIG = {
  city: "Varanasi",
  department: "Construction & Design Services",
  consultant: "NCPE Consultancy",
  latestWPR: "9–15 Nov 2026",
  center: [25.3176, 82.9939],
  info: { wards: 100, area: 148.8, outfalls: "—" },     // fill real values
  team: { rovers: 6, base: 2, members: 10 },

  // home-page cards + map pins: the six project cities (live = survey files added)
  cities: [
    {id:"lucknow",   name:"Lucknow",   lat:26.8467, lng:80.9462, live:false},
    {id:"prayagraj", name:"Prayagraj", lat:25.4358, lng:81.8463, live:false},
    {id:"kanpur",    name:"Kanpur",    lat:26.4499, lng:80.3319, live:false},
    {id:"varanasi",  name:"Varanasi",  lat:25.3176, lng:82.9739, live:true, drains:91.4, rovers:6},
    {id:"jhansi",    name:"Jhansi",    lat:25.4484, lng:78.5685, live:false},
    {id:"ayodhya",   name:"Ayodhya",   lat:26.7922, lng:82.1998, live:false}
  ],

  // right panel – "est" = estimated scope (leave null if not fixed)
  progress: [
    {name:"Primary Drain",        color:"#1d4ed8", done:58.5, est:120, unit:"km"},
    {name:"Secondary & Tertiary", color:"#ea7a17", done:73.0, est:null, unit:"km"},
    {name:"GCP Points",           color:"#e11d48", done:40,   est:86,  unit:"points"},
    {name:"Static Points",        color:"#6d28d9", done:3,    est:5,   unit:"points"},
    {name:"LiDAR Survey",         color:"#0891b2", done:48.6, est:160, unit:"sq km"}
  ],

  // map layers – upload these files into the "data" folder (KML or GeoJSON)
  layers: [
    {id:"ward",   group:"boundaries", name:"Ward Boundary",  icon:"▢", color:"#ea7a17", file:"ward_boundary.geojson",  unit:"wards",
      style:{color:"#ea7a17",weight:1.2,fillOpacity:0.03,dashArray:"4 3"}},
    {id:"outer",  group:"boundaries", name:"Outer Boundary", icon:"▢", color:"#0b1f2a", file:"outer_boundary.geojson", unit:"parts",
      style:{color:"#0b1f2a",weight:2.5,fill:false}, on:true, fit:true},
    {id:"buffer", group:"boundaries", name:"Buffer Area",    icon:"▢", color:"#d97706", file:"buffer_area.kml",    unit:"polygon",
      style:{color:"#d97706",weight:1.5,fillOpacity:0.06,dashArray:"6 4"}},
    {id:"ortho",  group:"survey", name:"Ortho Image", tag:"ORTHO", icon:"▦", color:"#7c3aed", type:"tiles", url:"", meta:"orthophoto tiles"},
    {id:"dsm",    group:"survey", name:"DSM Surface", tag:"DSM",   icon:"▦", color:"#16a34a", type:"tiles", url:"", meta:"elevation tiles", opacity:0.8},
    {id:"drains", group:"survey", name:"Drains Surveyed", icon:"—", color:"#1d4ed8", file:"drains.geojson",       unit:"drains", on:true},
    {id:"culverts", group:"survey", name:"Culverts", icon:"●", color:"#f59e0b", file:"culverts.geojson", unit:"culverts", radius:4},
    {id:"gcp",    group:"survey", name:"GCP Marked",      icon:"●", color:"#e11d48", file:"gcp.geojson",          unit:"points"},
    {id:"tbm",    group:"survey", name:"NCPE Points",     icon:"◆", color:"#6d28d9", file:"tbm.geojson",      unit:"points"},
    {id:"photos", group:"survey", name:"Survey Photos",   icon:"●", color:"#dc2626", file:"photos.geojson",   unit:"photos", radius:4},
    {id:"drone",  group:"survey", name:"Drone Survey Blocks", icon:"▢", color:"#0891b2", file:"drone_blocks.kml", unit:"blocks",
      style:{color:"#0891b2",weight:1.5,fillOpacity:0.08}}
  ]
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const fmt = n => (n===null||n===undefined||n==='') ? '—' : (isNaN(n) ? n : Number(n).toLocaleString('en-IN',{maximumFractionDigits:1}));
const DRAIN = {primary:{c:"#1d4ed8",w:3.5}, secondary:{c:"#ea7a17",w:2.2}, tertiary:{c:"#e11d48",w:1.4}, surveyed:{c:"#1d4ed8",w:2.6}};
const TILES = {
  streets:   () => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}),
  satellite: () => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'})
};
let maps = [];
const cache = {};
function clearMaps(){ maps.forEach(m=>m.remove()); maps=[]; }

/* ---------- data loading ---------- */
async function loadData(d){
  if (d.id in cache) return cache[d.id];
  try{
    const r = await fetch(d.file, {cache:'no-cache'});
    if(!r.ok) throw new Error('missing');
    let gj;
    if (/\.kml$/i.test(d.file)) gj = toGeoJSON.kml(new DOMParser().parseFromString(await r.text(),'text/xml'));
    else gj = await r.json();
    cache[d.id] = gj;
  }catch(e){ cache[d.id] = null; }
  return cache[d.id];
}
function drainStyle(f){
  const s = JSON.stringify(f.properties||{}).toLowerCase();
  const k = s.includes('tertiary') ? 'tertiary' : s.includes('secondary') ? 'secondary' : s.includes('primary') ? 'primary' : 'surveyed';
  return {color:DRAIN[k].c, weight:DRAIN[k].w, opacity:.9};
}
function popupHtml(d,p){
  const img = p.photo || p.url || p.image || p.img;
  const rows = Object.entries(p)
    .filter(([k,v]) => v!==null && v!=='' && typeof v!=='object' && !/^(style|stroke|fill|icon)/i.test(k))
    .slice(0,12).map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  return `<b>${d.name}</b>${img && /\.(jpe?g|png|webp)(\?|$)/i.test(img) ? `<img src="${img}" style="width:220px;display:block;margin:6px 0;border-radius:4px">` : ''}<table class="pt">${rows}</table>`;
}
function buildLayer(d,gj){
  return L.geoJSON(gj,{
    style: f => d.id==='drains' ? drainStyle(f) : (d.style || {color:d.color,weight:2}),
    pointToLayer: (f,ll) => L.circleMarker(ll,{radius:d.radius||5,color:'#fff',weight:1.5,fillColor:d.color,fillOpacity:1}),
    onEachFeature: (f,l) => { if (f.properties && Object.keys(f.properties).length) l.bindPopup(popupHtml(d,f.properties)); }
  });
}

/* ---------- home ---------- */
function home(){
  document.title = 'Dashboard for Survey Progress · IUSWDMP';
  const card = c => `<a class="ccard" href="#/city/${c.id}"><div class="arr"><span>→</span></div><h3>${c.name}</h3>
    <div class="lbl">Drains surveyed</div><div class="val">${fmt(c.drains)} <small>km</small></div>
    <div class="lbl">Rover units</div><div class="val">${fmt(c.rovers)} <small>units</small></div></a>`;
  $('#app').innerHTML = `
  <section class="hero"><div class="wrap">
    <p>Survey, Collection of Data, Preparation of Integrated Urban Storm Water Drainage Master Plan (IUSWDMP)</p>
    <h1>Dashboard for Survey Progress</h1>
  </div></section>
  <div class="wrap" style="padding:0 16px">
    <div class="cards">${CONFIG.cities.map(card).join('')}</div>
    <div id="homeMap"></div>
  </div>`;
  const m = L.map('homeMap',{scrollWheelZoom:false});
  maps.push(m);
  TILES.satellite().addTo(m);
  CONFIG.cities.forEach(c => L.circleMarker([c.lat,c.lng],{radius:7,color:'#fff',weight:2,fillColor:c.live?'#1f7a74':'#dc2626',fillOpacity:1})
    .addTo(m).bindTooltip(c.name,{permanent:true,direction:'right',offset:[8,0],className:'pin'})
    .on('click',()=>location.hash=`#/city/${c.id}`));
  m.fitBounds(CONFIG.cities.map(c=>[c.lat,c.lng]),{padding:[50,50]});
}

/* ---------- city ---------- */
function layerRow(d){
  const legend = d.id==='drains' ? `<div class="legend"><span><i style="background:${DRAIN.surveyed.c}"></i>Surveyed drain</span></div>` : '';
  return `<div class="layer"><span class="ic" style="background:${d.color}1f;color:${d.color}">${d.icon}</span>
    <div class="lt"><b>${d.name}${d.tag?`<span class="tag">${d.tag}</span>`:''}</b><small id="m-${d.id}">loading…</small></div>
    <input type="checkbox" class="tg" id="t-${d.id}" aria-label="${d.name}" disabled></div>${legend}`;
}
function progCard(p){
  const pc = p.est ? Math.min(100, p.done/p.est*100) : null;
  return `<div class="pc" style="--c:${p.color}"><div class="t"><span>${p.name}</span>${pc!==null?`<span class="pct">${pc.toFixed(0)}%</span>`:''}</div>
    <div class="nums"><div><div class="l">Done</div><div class="big">${fmt(p.done)}<small> ${p.unit}</small></div></div>
    ${p.est?`<div><div class="l">Estimated</div><div class="est">${fmt(p.est)}<small> ${p.unit}</small></div></div>`:''}</div>
    ${pc!==null?`<div class="pbar"><i style="width:${pc}%"></i></div>`:''}</div>`;
}
function cityHead(c){
  return `<div class="cityhead">
    <div><a class="back" href="#/">← All cities</a>
      <h1>${c.name}</h1>
      <div class="sub">${c.live ? `${fmt(CONFIG.info.area)} sq km · ${fmt(CONFIG.info.outfalls)} outfalls · WPR ${CONFIG.latestWPR}` : 'Survey data to be added'}</div></div>
    <div style="text-align:right"><div class="back" style="margin-bottom:5px">Switch city</div>
      <select class="sw" id="sw" aria-label="Switch city">
      ${CONFIG.cities.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name}</option>`).join('')}</select></div>
  </div>`;
}
function city(cityId){
  const c = CONFIG.cities.find(x=>x.id===cityId) || CONFIG.cities.find(x=>x.live);
  document.title = `${c.name} · Survey Progress`;
  const groups = [['boundaries','Boundaries'],['survey','Survey layers']];
  if (!c.live){
    $('#app').innerHTML = cityHead(c) + `<div class="stage" id="stage"><div id="cityMap"></div>
      <aside class="panel left" style="width:330px;bottom:auto"><div class="ph"><h2>${c.name}</h2></div>
      <div class="pb"><div class="sec" style="margin-top:4px">Status</div>
      <p style="font-size:13px;line-height:1.5;margin:6px 2px">Survey data for ${c.name} has not been added yet. Boundary, ward, drain and GCP files will appear here once they are uploaded.</p></div></aside></div>`;
    $('#sw').onchange = e => location.hash = '#/city/' + e.target.value;
    const m0 = L.map('cityMap').setView([c.lat,c.lng],11); maps.push(m0); TILES.streets().addTo(m0);
    L.circleMarker([c.lat,c.lng],{radius:8,color:'#fff',weight:2,fillColor:'#dc2626',fillOpacity:1}).addTo(m0);
    return;
  }
  $('#app').innerHTML = cityHead(c) + `
  <div class="stage" id="stage">
    <div id="cityMap"></div>
    <aside class="panel left">
      <div class="ph"><h2>Map layers</h2><button class="fs" id="fsBtn" title="Full screen">⛶</button></div>
      <div class="pb">
        <div class="sec">Basic information</div>
        <div class="info"><div><span>No. of wards</span><b>${fmt(CONFIG.info.wards)}</b></div><div><span>Area (sq. km)</span><b>${fmt(CONFIG.info.area)}</b></div></div>
        ${groups.map(g=>`<div class="sec">${g[1]}</div>`+CONFIG.layers.filter(l=>l.group===g[0]).map(layerRow).join('')).join('')}
      </div>
      <div class="basemap"><div class="sec" style="margin-top:0">Basemap</div>
        <div class="seg"><button id="bStreets" class="on">▦ Streets</button><button id="bSat">⛰ Satellite</button></div></div>
    </aside>
    <aside class="panel right">
      <div class="ph" style="display:block"><div class="k">Survey progress</div><h2>${c.name}</h2></div>
      <div class="pb">
        <div class="wprrow"><span>Latest WPR</span><b>${CONFIG.latestWPR}</b></div>
        ${CONFIG.progress.map(progCard).join('')}
        <div class="pc" style="--c:#0b1f2a"><div class="t"><span>Survey Team</span></div>
          <div class="nums three"><div><div class="l">Rovers</div><div class="big">${CONFIG.team.rovers}</div></div>
          <div><div class="l">Base</div><div class="big">${CONFIG.team.base}</div></div>
          <div><div class="l">Members</div><div class="big">${CONFIG.team.members}</div></div></div></div>
      </div>
    </aside>
  </div>`;

  $('#sw').onchange = e => location.hash = '#/city/' + e.target.value;

  const m = L.map('cityMap',{zoomControl:false}).setView([c.lat,c.lng],12);
  maps.push(m);
  L.control.zoom({position:'bottomright'}).addTo(m);
  L.control.scale({position:'bottomright',imperial:false}).addTo(m);
  let base = TILES.streets().addTo(m);
  const setBase = k => { m.removeLayer(base); base = TILES[k]().addTo(m); base.bringToBack();
    $('#bStreets').classList.toggle('on',k==='streets'); $('#bSat').classList.toggle('on',k==='satellite'); };
  $('#bStreets').onclick = () => setBase('streets');
  $('#bSat').onclick = () => setBase('satellite');

  $('#fsBtn').onclick = () => { const s=$('#stage'); document.fullscreenElement ? document.exitFullscreen() : (s.requestFullscreen && s.requestFullscreen()); };
  document.onfullscreenchange = () => setTimeout(()=>maps.forEach(x=>x.invalidateSize()),200);

  CONFIG.layers.forEach(async d => {
    const meta = $('#m-'+d.id), tg = $('#t-'+d.id);
    let lyr;
    if (d.type === 'tiles'){
      if (!d.url){ meta.textContent = 'add tile URL in CONFIG'; return; }
      lyr = L.tileLayer(d.url,{maxZoom:22,opacity:d.opacity||1});
      meta.textContent = d.meta || '';
    } else {
      const gj = await loadData(d);
      if (!maps.includes(m)) return;               // user left the page
      if (!gj){ meta.textContent = 'file not added yet'; return; }
      const n = (gj.features||[]).length;
      meta.textContent = `${fmt(n)} ${d.unit||'features'}${d.meta?' · '+d.meta:''}`;
      lyr = buildLayer(d,gj);
      if (d.fit){ try{ m.fitBounds(lyr.getBounds(),{paddingTopLeft:[290,20],paddingBottomRight:[320,20]}); }catch(e){} }
    }
    tg.disabled = false;
    const set = on => on ? lyr.addTo(m) : m.removeLayer(lyr);
    tg.onchange = () => set(tg.checked);
    if (d.on){ tg.checked = true; set(true); }
  });
}

/* ---------- router ---------- */
function route(){
  clearMaps();
  const h = location.hash || '#/';
  const c = h.match(/^#\/city\/([^/?]+)/);
  c ? city(c[1]) : home();
  window.scrollTo(0,0);
}
$('#wprTag').textContent = `Latest WPR · ${CONFIG.latestWPR}`;
$('#foot').textContent = `© ${new Date().getFullYear()} ${CONFIG.consultant} · Client: ${CONFIG.department} · IUSWDMP`;
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
