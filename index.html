<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a2a66">
<meta name="description" content="Integrated Urban Storm Water Drainage Master Plans (IUSWDMP) for Urban Local Bodies in Uttar Pradesh">
<meta property="og:type" content="website">
<meta property="og:title" content="IUSWDMP Portal · Uttar Pradesh">
<meta property="og:description" content="Integrated Urban Storm Water Drainage Master Plans for Lucknow, Prayagraj, Kanpur, Varanasi, Jhansi and Ayodhya.">
<title>IUSWDMP Portal · Uttar Pradesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#0a2a66;--blue:#1565c0;--sky:#e8f2fb;--red:#d32027;--green:#0b7d6e;--txt:#16233a;--mut:#62708a;--line:#d9e2ee;--card:#fff;--bg:#f5f8fc;
--sans:"Poppins","Noto Sans Devanagari",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);line-height:1.5}
a{color:var(--blue)}
img{max-width:100%}
/* header */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px rgba(10,42,102,.06)}
.row1{display:flex;align-items:center;gap:12px;padding:6px 18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);flex:1;min-width:0}
.brand img{height:42px;width:42px;border-radius:50%;object-fit:cover}
.brand b{display:block;font-size:15px;letter-spacing:1px;font-weight:800;line-height:1.1}
.brand small{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logos{display:flex;align-items:center;gap:10px}
.logos img{height:40px;width:auto;object-fit:contain}
.nav{display:flex;gap:6px;align-items:center;padding:0 14px 8px;overflow-x:auto;scrollbar-width:thin}
.nav a{flex:none;text-decoration:none;color:var(--navy);font-size:11.5px;font-weight:600;line-height:1.15;text-align:center;padding:6px 10px;border:1.5px solid var(--line);border-radius:7px;background:#fff;transition:.15s}
.nav a:hover{border-color:var(--blue);background:var(--sky)}
.nav a.on{border-color:var(--red);box-shadow:0 0 0 1.5px var(--red) inset;color:var(--red)}
.nav .csel{flex:none;display:flex;align-items:center;gap:6px;margin:0 4px;padding-left:10px;border-left:2px solid var(--line)}
.nav .csel span{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.nav select{font:600 12px var(--sans);color:#fff;background:var(--navy);border:0;border-radius:7px;padding:7px 8px}
/* landing */
.land{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:linear-gradient(115deg,#fff 50%,#e3f1fb)}
.land .l{padding:5vh 6vw;display:flex;flex-direction:column;justify-content:center;gap:16px}
.dept{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mut)}
.dept img{height:56px;width:56px;border-radius:50%}
.dept b{display:block;color:var(--green);font-size:15px}
.land h1{margin:0;color:var(--navy);font-weight:800;line-height:1.2}
.land h1 .hi{display:block;font-size:clamp(28px,4.2vw,50px)}
.land h1 .en{display:block;font-size:clamp(19px,2.4vw,29px);color:var(--txt);margin-top:10px}
.land h1 small{display:block;font-size:14px;font-weight:500;color:var(--mut);margin-top:6px}
.enter{display:inline-flex;flex-direction:column;align-items:center;background:var(--green);color:#fff;text-decoration:none;border-radius:99px;padding:11px 34px;font-weight:700;font-size:17px;box-shadow:0 8px 20px rgba(11,125,110,.3);transition:.15s;width:max-content}
.enter small{font-weight:500;font-size:12px}
.enter:hover{transform:translateY(-2px)}
.org{font-size:13px}.org b{display:block;font-size:17px;color:var(--navy);letter-spacing:.5px}
.org .ta{margin-top:8px;font-size:12px;color:var(--mut)}.org .ta strong{color:var(--blue)}
.land .r{background:center/cover no-repeat;min-height:240px;border-radius:0 0 0 80px}
.landlogos{display:flex;gap:14px;align-items:center}.landlogos img{height:46px}
@media(max-width:850px){.land{grid-template-columns:1fr;min-height:0}.land .r{order:-1;border-radius:0}}
/* generic page */
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 44px}
.band{background:linear-gradient(100deg,#0a2a66,#1565c0);color:#fff;padding:16px 20px}
.band .in{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.band small{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}
.band h1{margin:2px 0 0;font-size:clamp(19px,2.4vw,26px);font-weight:700}
.band h1 span{font-weight:500;opacity:.9}
.band .pill{background:#fff;color:var(--navy);border-radius:99px;padding:5px 16px;font-weight:700;font-size:13px}
h2{color:var(--navy);font-size:18px;margin:26px 0 10px}
.lead{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{margin:0 0 6px;color:var(--navy);font-size:15px}
.card p{margin:0;font-size:13.5px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.lbar{border-left:4px solid var(--blue)}
.todo{border:2px dashed #c9d6e6;background:#fbfdff;border-radius:12px;padding:18px;text-align:center;color:var(--mut);font-size:13.5px}
.todo b{display:block;color:var(--navy);margin-bottom:2px}
.stat span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.stat b{font-size:26px;color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums}
.stat b small{font-size:12px;color:var(--mut);font-weight:500;margin-left:4px}
.note{font-size:12px;color:var(--mut);margin-top:10px}
/* cities */
.cities{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.cities{grid-template-columns:1fr}}
.upmap{background:linear-gradient(160deg,#eef6fd,#fff);border:1px solid var(--line);border-radius:14px;padding:8px}
.upmap svg{display:block;width:100%;height:auto}
.upmap .st{fill:#fff;stroke:#8a9bb5;stroke-width:3;filter:drop-shadow(0 6px 10px rgba(10,42,102,.12))}
.upmap .pin{cursor:pointer}
.upmap .pin .halo{fill:var(--red);opacity:.18;transition:.2s}
.upmap .pin .dot{fill:var(--red);stroke:#fff;stroke-width:5}
.upmap .pin.live .dot{fill:var(--green)}.upmap .pin.live .halo{fill:var(--green)}
.upmap .pin text{font:700 46px var(--sans);fill:var(--red);paint-order:stroke;stroke:#fff;stroke-width:9px}
.upmap .pin.live text{fill:var(--green)}
.upmap .pin:hover .halo{opacity:.4}
.key{background:#fff;border:2px solid var(--red);border-radius:12px;padding:10px 16px;text-align:center;margin-bottom:14px}
.key b{display:block;font-size:26px;color:var(--red);font-weight:800;line-height:1.1}
.key span{font-weight:700;color:var(--navy);font-size:13px;letter-spacing:.5px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--navy);color:#fff;font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--sky)}
tfoot td{font-weight:700;background:var(--navy);color:#fff}
.badge{font-size:10.5px;padding:2px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
.badge.live{background:#e5f5ef;border-color:#9fd3c4;color:var(--green)}
.badge.wait{background:#fff4e0;border-color:#f0cf97;color:#8a5a0b}
.legendrow{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legendrow i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
/* map stage */
.stage{position:relative;height:640px;background:#e4eaf2;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#cityMap{position:absolute;inset:0}
.panel{position:absolute;top:12px;bottom:12px;width:262px;background:#fff;border:1px solid var(--line);border-radius:10px;z-index:500;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(10,42,102,.1)}
.panel.left{left:12px}.panel.right{right:12px;width:290px}
.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ph h2{font-size:16px;margin:0}
.ph .k{font-family:var(--mono);font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.fs{border:0;background:none;cursor:pointer;color:var(--mut);font-size:15px}
.pb{overflow:auto;padding:8px 14px;flex:1}
.sec{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:12px 2px 6px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info div{border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.info span{font-family:var(--mono);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.info b{display:block;font-family:var(--mono);font-size:16px}
.layer{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:6px}
.layer:hover{background:var(--sky)}
.ic{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font-size:10px;flex:none}
.lt{flex:1;min-width:0}
.lt b{display:block;font-size:12px;font-weight:600}
.lt small{font-family:var(--mono);font-size:9px;color:var(--mut)}
.tag{font-family:var(--mono);font-size:7.5px;border:1px solid var(--line);padding:0 3px;border-radius:2px;margin-left:5px;color:var(--mut);vertical-align:middle}
.tg{appearance:none;-webkit-appearance:none;width:26px;height:14px;border-radius:99px;background:#cfd8e3;position:relative;cursor:pointer;flex:none;transition:.2s;margin:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.2s}
.tg:checked{background:var(--green)}.tg:checked::after{left:14px}
.tg:disabled{opacity:.4;cursor:not-allowed}
.basemap{padding:10px 14px 12px;border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;font:600 11px var(--sans);padding:6px;border-radius:4px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}
.wprrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--mut);padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.wprrow b{color:var(--txt)}
.pc{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:7px;padding:9px 12px;margin-bottom:8px;background:#fff}
.pc .t{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
.pc .t>span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:middle}
.pct{font-family:var(--mono);font-size:12px;color:var(--c)}
.nums{display:grid;grid-template-columns:1fr 1fr;margin-top:6px}
.nums.three{grid-template-columns:1fr 1fr 1fr}
.nums .l{font-family:var(--mono);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.nums .big{font-family:var(--mono);font-size:17px;font-weight:700}
.nums .est{font-family:var(--mono);font-size:13px;margin-top:3px}
.nums small{font-size:8px;color:var(--mut);font-weight:400}
.pbar{height:3px;background:#e8edf3;border-radius:9px;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c)}
.pt td{font-size:11px;padding:1px 8px 1px 0;vertical-align:top;border:0}
.pt td:first-child{color:var(--mut)}
/* measures */
.sol{border-radius:16px;padding:16px;text-align:center;font-size:13px}
.sol .n{display:inline-block;background:#fff;border-radius:99px;padding:4px 14px;font-weight:700;font-size:12px;margin-bottom:8px}
.sol h3{margin:0 0 6px;font-size:14.5px;color:var(--red)}
.opt{padding:0;overflow:hidden}
.opt img{width:100%;height:185px;object-fit:cover;display:block}
.opt .b{padding:12px 16px}
.opt h3{display:flex;gap:8px;align-items:center}
.opt .no{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700}
.opt .c{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px}
.opt .c b{color:var(--navy)}
.step{display:flex;gap:12px;margin:10px 0;font-size:13.5px}
.step .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
footer{text-align:center;font-size:11.5px;color:var(--mut);padding:16px;border-top:1px solid var(--line);background:#fff}
@media(max-width:900px){
 .stage{height:auto;border:0;background:none;overflow:visible}
 #cityMap{position:relative;height:60vh;border-radius:12px}
 .panel{position:relative;inset:auto;width:auto!important;margin:12px 0}
 .pb{overflow:visible}
 .logos img{height:30px}.brand small{display:none}
}
/* header v2 */
.row1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.org1{display:flex;align-items:center;gap:9px;min-width:0}
.org1 img{height:44px;width:auto;object-fit:contain;flex:none}
.org1 b{display:block;font-size:13.5px;color:var(--navy);line-height:1.2;font-weight:700}
.org1 small{display:block;font-size:10.5px;color:var(--mut)}
.org1.end{justify-content:flex-end;text-align:right}
@media(max-width:900px){.org1 div{display:none}.org1 img{height:34px}}
/* landing art */
.land .r{background:linear-gradient(160deg,#061a40,#0d47a1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vh 2vw;min-height:300px}
.land .r svg{width:100%;max-height:76vh;display:block}
.land .r text{font:700 46px var(--sans);fill:#fff}
.land .cap{color:#cfe8ff;font-size:14px;text-align:center;margin-top:6px}
.land .cap b{color:#fff}
.rip{fill:none;stroke:#7fd4ff;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:rip 3.2s ease-out infinite}
.rip.d2{animation-delay:1.6s}
.flow{fill:none;stroke:#7fd4ff;stroke-width:5;stroke-dasharray:14 18;stroke-linecap:round;opacity:.65;animation:flow 2.5s linear infinite}
@keyframes rip{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-64}}
@media(prefers-reduced-motion:reduce){.rip,.flow{animation:none}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="row1">
    <a class="brand" href="#/">
      <img src="img_up.jpg" alt="Government of Uttar Pradesh" onerror="this.remove()">
      <div><b>IUSWDMP</b><small>Integrated Urban Storm Water Drainage Master Plans · Uttar Pradesh</small></div>
    </a>
    <div class="org1 mid">
      <img src="ncpe.jpg" alt="" onerror="this.remove()">
      <div><b>NCPE Infrastructure India Pvt. Ltd.</b><small>Technical Associate</small></div>
    </div>
    <div class="org1 end">
      <div><b>Construction &amp; Design Services</b><small>Uttar Pradesh Jal Nigam (Urban)</small></div>
      <img src="cds.jpg" alt="" onerror="this.remove()">
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Portal sections"></nav>
</header>
<main id="app" tabindex="-1"></main>
<footer id="foot" hidden></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =================== EDIT THIS BLOCK =================== */
const CONFIG = {
  department: "Construction & Design Services, Uttar Pradesh Jal Nigam (Urban)",
  consultant: "NCPE Infrastructure India Private Limited",
  latestWPR: "9–15 Nov 2026",

  // Progress cards on every city's Work Progress tab. Fill [done, estimated] per city below.
  // (Varanasi figures are sample values – replace with the real weekly progress report.)
  progressTemplate: [
    {name:"Primary Drain",        color:"#1565c0", unit:"km"},
    {name:"Secondary & Tertiary", color:"#ea7a17", unit:"km"},
    {name:"GCP Points",           color:"#d32027", unit:"points"},
    {name:"Static Points",        color:"#6d28d9", unit:"points"},
    {name:"LiDAR Survey",         color:"#0891b2", unit:"sq km"}
  ],

  // The six project cities. All map files sit next to index.html.
  //   Varanasi: ward_boundary.geojson, drains.geojson ...   Others: lucknow_ward_boundary.geojson, lucknow_drains.geojson ...
  // live:true once survey files are uploaded. area = Nagar Nigam area (km², from the project deck).
  // costs: eight numbers in ₹ crore, in the order of the Project Costs table, e.g. costs:[120,80,60,15,10,8,12,5]
  cities: [
    {id:"lucknow",   name:"Lucknow",   hi:"लखनऊ",     lat:26.8467, lng:80.9462, prefix:"lucknow_",   live:false, area:562.00, wards:null, drains:null, culverts:null, rovers:null, team:null, costs:null},
    {id:"prayagraj", name:"Prayagraj", hi:"प्रयागराज", lat:25.4358, lng:81.8463, prefix:"prayagraj_", live:false, area:314.79, wards:null, drains:null, culverts:null, rovers:null, team:null, costs:null},
    {id:"kanpur",    name:"Kanpur",    hi:"कानपुर",    lat:26.4499, lng:80.3319, prefix:"kanpur_",    live:false, area:265.59, wards:null, drains:null, culverts:null, rovers:null, team:null, costs:null},
    {id:"varanasi",  name:"Varanasi",  hi:"वाराणसी",   lat:25.3176, lng:82.9739, prefix:"",           live:true,  area:149.23, wards:100,  drains:91.4, culverts:309,  rovers:6,
      team:{rovers:6, base:2, members:10}, costs:null,
      progress:{"Primary Drain":[58.5,120], "Secondary & Tertiary":[73.0,null], "GCP Points":[40,86], "Static Points":[3,5], "LiDAR Survey":[48.6,160]}},
    {id:"jhansi",    name:"Jhansi",    hi:"झाँसी",     lat:25.4484, lng:78.5685, prefix:"jhansi_",    live:false, area:172.22, wards:null, drains:null, culverts:null, rovers:null, team:null, costs:null},
    {id:"ayodhya",   name:"Ayodhya",   hi:"अयोध्या",   lat:26.7922, lng:82.1998, prefix:"ayodhya_",   live:false, area:87.09,  wards:null, drains:null, culverts:null, rovers:null, team:null, costs:null}
  ],

  // Map layers (GeoJSON files; a layer appears as soon as its file is uploaded)
  layers: [
    {id:"ward",   group:"Boundaries", name:"Ward Boundary",  icon:"▢", color:"#ea7a17", file:"ward_boundary.geojson",  unit:"wards",
      style:{color:"#ea7a17",weight:1.2,fillOpacity:0.03,dashArray:"4 3"}},
    {id:"outer",  group:"Boundaries", name:"Outer Boundary", icon:"▢", color:"#0a2a66", file:"outer_boundary.geojson", unit:"boundary",
      style:{color:"#0a2a66",weight:2.5,fill:false}, fit:true},
    {id:"buffer", group:"Boundaries", name:"Buffer Area",    icon:"▢", color:"#d97706", file:"buffer_area.geojson",    unit:"polygons",
      style:{color:"#d97706",weight:1.5,fillOpacity:0.06,dashArray:"6 4"}},
    {id:"rivers",   group:"Rivers and terrain", name:"Rivers", icon:"≈", color:"#0ea5e9", file:"rivers.geojson", unit:"rivers",
      style:{color:"#0ea5e9",weight:4,opacity:.75}},
    {id:"contours", group:"Rivers and terrain", name:"Contours", tag:"0.5 M", icon:"≋", color:"#b45309", file:"contours.geojson", unit:"lines", ramp:"Elevation (m)"},
    {id:"ortho",  group:"Survey layers", name:"Ortho Image", tag:"ORTHO", icon:"▦", color:"#7c3aed", type:"tiles", url:"", meta:"orthophoto tiles"},
    {id:"dsm",    group:"Survey layers", name:"DSM Surface", tag:"DSM",   icon:"▦", color:"#16a34a", type:"tiles", url:"", meta:"elevation tiles", opacity:0.8},

/* ---------- data ---------- */
async function loadData(c,d){
  const key = c.id+'/'+d.id;
  if (key in cache) return cache[key];
  const feats = []; let found = false;
  for (const f of (d.files || [d.file])){          // a layer can combine several files
    try{
      const r = await fetch(c.prefix + f, {cache:'no-cache'});
      if(!r.ok) continue;
      feats.push(...((await r.json()).features || [])); found = true;
    }catch(e){}
  }
  cache[key] = found ? {type:'FeatureCollection', features:feats} : null;
  return cache[key];
}
function popupHtml(d,p){
  const rows = Object.entries(p).filter(([k,v]) => v!==null && v!=='' && typeof v!=='object').slice(0,12)
    .map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  const ph = Array.isArray(p.photos) ? p.photos : [];
  const pics = ph.length ? `<a href="${ph[0]}" target="_blank" rel="noopener"><img src="${ph[0]}" alt="Photo of ${p.Point||d.name}" loading="lazy" style="width:240px;max-width:100%;display:block;margin:6px 0 4px;border-radius:5px"></a>`
    + (ph.length>1 ? `<div style="font-size:11px">More photos: ${ph.slice(1).map((f,i)=>`<a href="${f}" target="_blank" rel="noopener">${i+2}</a>`).join(' · ')}</div>` : '') : '';
  return `<b>${p.Point||d.name}</b>${pics}<table class="pt">${rows}</table>`;
}
const RAMP = [[37,99,235],[22,163,74],[234,179,8],[194,65,12]];   // low (blue) → high (brown)
function rampColor(t){
  t = Math.max(0,Math.min(1,t)) * (RAMP.length-1); const i = Math.min(RAMP.length-2,Math.floor(t)), f = t-i;
  return 'rgb(' + RAMP[i].map((v,k)=>Math.round(v+(RAMP[i+1][k]-v)*f)).join(',') + ')';
}
function buildLayer(d,gj){
  let lo = 0, hi = 1;
  if (d.ramp){ const v = gj.features.map(f=>f.properties[d.ramp]).filter(x=>x!=null); lo = Math.min(...v); hi = Math.max(...v); d._range = [lo,hi]; }
  return L.geoJSON(gj,{
    style: f => d.ramp ? {color:rampColor((f.properties[d.ramp]-lo)/((hi-lo)||1)), weight:(f.properties[d.ramp]%5===0)?2.4:1.1, opacity:.9}
                       : (d.style || {color:d.color,weight:2}),
    pointToLayer: (f,ll) => L.circleMarker(ll,{radius:d.radius||5,color:'#fff',weight:1.5,fillColor:d.color,fillOpacity:1}),
    onEachFeature: (f,l) => { if (f.properties && Object.keys(f.properties).length) l.bindPopup(popupHtml(d,f.properties)); }
  });
}

function layerRow(d){
  return `<div class="layer"><span class="ic" style="background:${d.color}1f;color:${d.color}">${d.icon}</span>
    <div class="lt"><b>${d.name}${d.tag?`<span class="tag">${d.tag}</span>`:''}</b><small id="m-${d.id}">loading…</small></div>
    <input type="checkbox" class="tg" id="t-${d.id}" aria-label="${d.name}" disabled></div>`;
}
function stageHtml(c, ids, right){
  const ls = CONFIG.layers.filter(l=>ids.includes(l.id));
  const groups = [...new Set(ls.map(l=>l.group))];
  return `<div class="stage" id="stage"><div id="cityMap"></div>
    <aside class="panel left">
      <div class="ph"><h2>Map layers</h2><button class="fs" id="fsBtn" title="Full screen">⛶</button></div>

        ${groups.map(g=>`<div class="sec">${g}</div>`+ls.filter(l=>l.group===g).map(layerRow).join('')).join('')}
      </div>
      <div class="basemap"><div class="seg"><button id="bStreets">▦ Streets</button><button id="bSat">⛰ Satellite</button></div></div>
    </aside>${right||''}</div>`;
}
function stageInit(c, ids, on, basemap){
  const m = L.map('cityMap',{zoomControl:false,scrollWheelZoom:false}).setView([c.lat,c.lng],12);
  maps.push(m);
  L.control.zoom({position:'bottomright'}).addTo(m);
  L.control.scale({position:'bottomright',imperial:false}).addTo(m);
  let base;
  const setBase = k => { if(base) m.removeLayer(base); base = TILES[k]().addTo(m); base.bringToBack();
    $('#bStreets').classList.toggle('on',k==='streets'); $('#bSat').classList.toggle('on',k==='satellite'); };
  setBase(basemap||'streets');
  $('#bStreets').onclick = () => setBase('streets');
  $('#bSat').onclick = () => setBase('satellite');
  $('#fsBtn').onclick = () => { const s=$('#stage'); document.fullscreenElement ? document.exitFullscreen() : (s.requestFullscreen && s.requestFullscreen()); };
  document.onfullscreenchange = () => setTimeout(()=>maps.forEach(x=>x.invalidateSize()),200);
  const wide = window.innerWidth > 900, hasRight = !!document.querySelector('.panel.right');
  CONFIG.layers.filter(l=>ids.includes(l.id)).forEach(async d => {
    const meta = $('#m-'+d.id), tg = $('#t-'+d.id);
    let lyr;
    if (d.type === 'tiles'){
      if (!d.url){ meta.textContent = 'to be added'; return; }
      lyr = L.tileLayer(d.url,{maxZoom:22,opacity:d.opacity||1});
      meta.textContent = d.meta || '';
    } else {
      const gj = await loadData(c,d);
      if (!maps.includes(m)) return;
      if (!gj){ meta.textContent = 'file not added yet'; return; }
      lyr = buildLayer(d,gj);
      meta.textContent = `${fmt((gj.features||[]).length)} ${d.unit||'features'}` + (d._range ? ` · ${d._range[0]}–${d._range[1]} m` : '');
      if (d.fit){ try{ m.fitBounds(lyr.getBounds(),{paddingTopLeft:[wide?285:10,15],paddingBottomRight:[wide&&hasRight?310:10,15]}); }catch(e){} }
    }
    tg.disabled = false;
    const set = v => v ? lyr.addTo(m) : m.removeLayer(lyr);
    tg.onchange = () => set(tg.checked);
    if (on.includes(d.id)){ tg.checked = true; set(true); }
  });
}

function heroArt(){
  const P = UP.pins, order = ['jhansi','kanpur','lucknow','ayodhya','varanasi','prayagraj','kanpur'];
  const link = order.slice(1).map((k,i) => { const a=P[order[i]], b=P[k]; return `M${a[0]} ${a[1]} Q${(a[0]+b[0])/2} ${(a[1]+b[1])/2-60} ${b[0]} ${b[1]}`; }).join(' ');
  const lab = {lucknow:[0,-40,'middle'],ayodhya:[36,16,'start'],kanpur:[-36,16,'end'],prayagraj:[0,-40,'middle'],varanasi:[36,16,'start'],jhansi:[36,16,'start']};
  const tot = CONFIG.cities.reduce((a,c)=>a+c.area,0);
  return `<svg viewBox="${UP.vb.join(' ')}" role="img" aria-label="Uttar Pradesh with the six project cities">
    <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc8ff" stop-opacity=".30"/><stop offset="1" stop-color="#5cc8ff" stop-opacity=".06"/></linearGradient></defs>
    <path d="${UP.path}" fill="none" stroke="#5cc8ff" stroke-opacity=".07" stroke-width="70" stroke-linejoin="round"/>
    <path d="${UP.path}" fill="none" stroke="#5cc8ff" stroke-opacity=".12" stroke-width="30" stroke-linejoin="round"/>
    <path d="${UP.path}" fill="url(#hg)" stroke="#9fdcff" stroke-width="4"/>
    <path class="flow" d="${link}"/>
    ${CONFIG.cities.map(c => { const [x,y]=P[c.id], l=lab[c.id];
      return `<a href="#/city/${c.id}/progress"><circle class="rip" cx="${x}" cy="${y}" r="30"/><circle class="rip d2" cx="${x}" cy="${y}" r="30"/><circle cx="${x}" cy="${y}" r="15" fill="${c.live?'#6ee7b7':'#fff'}"/><text x="${x+l[0]}" y="${y+l[1]}" text-anchor="${l[2]}">${c.name}</text></a>`; }).join('')}
  </svg><div class="cap"><b>6 cities</b> · ${fmt(tot,2)} km² · one integrated drainage master plan</div>`;
}

/* ---------- pages ---------- */

  document.title = 'IUSWDMP Portal · Uttar Pradesh';
  $('#app').innerHTML = `<section class="land"><div class="l">
    <div class="dept"><img src="img_up.jpg" alt="" onerror="this.remove()"><div><b>नगर विकास विभाग, उत्तर प्रदेश</b>Urban Development Department, Uttar Pradesh</div></div>
    <h1><span class="hi">एकीकृत शहरी वर्षाजल<br>निकासी मास्टर प्लान</span><span class="en">Integrated Urban Stormwater Drainage Master Plans</span>
      <small>For Urban Local Bodies in Uttar Pradesh</small></h1>
    <a class="enter" href="#/about">Enter Portal →<small>पोर्टल में प्रवेश करें</small></a>
    <div class="org"><b>CONSTRUCTION &amp; DESIGN SERVICES</b>Uttar Pradesh Jal Nigam (Urban)
      <div class="ta">Technical Associate: <strong>${CONFIG.consultant}</strong></div></div>
    <div class="landlogos"><img src="cds.jpg" alt="C&amp;DS" onerror="this.remove()"><img src="ncpe.jpg" alt="NCPE" onerror="this.remove()"></div>
  </div><div class="r">${heroArt()}</div></section>`;
}
function about(){
  $('#app').innerHTML = `<div class="band"><div class="in"><div><small>उत्तर प्रदेश के नगरीय स्थानीय निकायों के लिए एकीकृत शहरी वर्षाजल निकासी मास्टर योजनाएँ</small>
    <h1>Integrated Urban Stormwater Drainage Master Plans <span>for Urban Local Bodies in Uttar Pradesh</span></h1></div></div></div>
  <div class="wrap">
    <div class="grid">
      <div class="card lbar"><h3>Urban Drainage Challenges</h3><p>The existing stormwater drainage networks in municipal corporation areas are inadequate to meet current requirements, resulting in recurrent waterlogging, urban flooding and significant economic losses. These conditions disrupt livelihoods, reduce workforce productivity and aggravate public health risks.</p></div>
      <div class="card lbar"><h3>Need for Integrated Planning</h3><p>In the absence of comprehensive stormwater drainage master plans, projects are often implemented in isolation, resulting in fragmented networks, connectivity gaps and hydraulic bottlenecks. This limits the effectiveness of investments and prevents systematic improvements in drainage performance.</p></div>
      <div class="card lbar"><h3>The C&amp;DS Initiative</h3><p>To address these challenges, the C&amp;DS Wing of Uttar Pradesh Jal Nigam (Urban) has initiated the preparation of Integrated Urban Stormwater Drainage Master Plans, initially covering municipal corporation areas.</p></div>
    </div>
    <h2>Objectives</h2>
    <div class="grid g3">
      <div class="card"><h3>a. Framework for project planning and prioritisation</h3><p>Equip Urban Local Bodies with a practical reference for identifying, selecting and implementing drainage projects based on local needs, catchment requirements and citywide priorities.</p></div>
      <div class="card"><h3>b. Coordinated investment and phased network development</h3><p>Streamline expenditure on stormwater drainage works and progressively develop an integrated, hydraulically efficient network, with removal of bottlenecks and adoption of automation and monitoring systems.</p></div>
      <div class="card"><h3>c. Groundwater recharge through sponge city initiatives</h3><p>Incorporate rainwater harvesting, infiltration and retention measures to reduce surface runoff, enhance groundwater recharge and support sustainable urban water management.</p></div>
    </div>
    <p style="margin-top:22px"><a class="enter" style="font-size:14px;padding:9px 26px" href="#/cities">View the cities →</a></p>
  </div>`;
}
function cities(){
  const lab = {lucknow:[0,-34,'middle'],ayodhya:[34,16,'start'],kanpur:[34,16,'start'],prayagraj:[0,-34,'middle'],varanasi:[34,16,'start'],jhansi:[34,16,'start']};
  const pins = CONFIG.cities.map(c => { const [x,y]=UP.pins[c.id], l=lab[c.id];
    return `<a href="#/city/${c.id}/progress"><g class="pin ${c.live?'live':''}"><circle class="halo" cx="${x}" cy="${y}" r="38"/><circle class="dot" cx="${x}" cy="${y}" r="17"/><text x="${x+l[0]}" y="${y+l[1]}" text-anchor="${l[2]}">${c.name}</text></g></a>`; }).join('');
  const tot = CONFIG.cities.reduce((a,c)=>a+c.area,0);
  $('#app').innerHTML = `<div class="band"><div class="in"><div><small>Project coverage</small><h1>Urban Local Bodies (ULBs) in Uttar Pradesh</h1></div><span class="pill">Key cities supported by NCPE</span></div></div>
  <div class="wrap"><div class="cities">
    <div><div class="upmap"><svg viewBox="${UP.vb.join(' ')}" role="img" aria-label="Map of Uttar Pradesh showing the six project cities"><path class="st" d="${UP.path}"/>${pins}</svg></div>
      <div class="legendrow"><span><i style="background:var(--green)"></i>Survey data live</span><span><i style="background:var(--red)"></i>Data to be added</span><span>Click a city to open it</span></div></div>
    <div><div class="key"><b>6 KEY ULBs</b><span>SUPPORTED BY NCPE</span></div>
      <div class="tw"><table><thead><tr><th>Sl.</th><th>Name of ULB</th><th class="n">Nagar Nigam area (km²)</th><th>Status</th></tr></thead>
      <tbody>${CONFIG.cities.map((c,i)=>`<tr><td>${i+1}</td><td><a href="#/city/${c.id}/progress"><b>${c.name}</b></a> <span style="color:var(--mut)">${c.hi}</span></td><td class="n">${fmt(c.area,2)}</td><td><span class="badge ${c.live?'live':'wait'}">${c.live?'Survey data live':'Data awaited'}</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">Total</td><td class="n">${fmt(tot,2)}</td><td></td></tr></tfoot></table></div>
      <p class="note">Technical Associate: ${CONFIG.consultant}</p></div>
  </div></div>`;
}
function progCard(p){
  const pc = (p.est && p.done!=null) ? Math.min(100, p.done/p.est*100) : null;
  return `<div class="pc" style="--c:${p.color}"><div class="t"><span>${p.name}</span>${pc!==null?`<span class="pct">${pc.toFixed(0)}%</span>`:''}</div>
    <div class="nums"><div><div class="l">Done</div><div class="big">${fmt(p.done)}<small> ${p.unit}</small></div></div>
    ${p.est?`<div><div class="l">Estimated</div><div class="est">${fmt(p.est)}<small> ${p.unit}</small></div></div>`:''}</div>
    ${pc!==null?`<div class="pbar"><i style="width:${pc}%"></i></div>`:''}</div>`;
}
const PAGES = {
  lidar(c){
    const ids=['outer','ortho','gcp'];
    $('#app').innerHTML = band(c,'lidar') + `<div class="wrap"><p class="lead">Advanced geospatial surveys for stormwater planning – LiDAR-based urban mapping and upstream catchment delineation.</p>
      <div class="grid g2" style="margin-bottom:16px"><div class="card"><h3>LiDAR Survey of the ULB Area</h3><p>State-of-the-art LiDAR surveying is proposed to acquire detailed, high-resolution topographic data across the Urban Local Body area. The survey supports the mapping of terrain levels, drainage corridors and key surface features for stormwater planning.</p></div>
      <div class="card"><h3>Upstream Catchment Mapping</h3><p>High-resolution satellite imagery complements the LiDAR survey to delineate upstream basins and identify catchments extending beyond the municipal boundary, providing a consistent spatial base for runoff assessment and flood mitigation proposals.</p></div></div>
      <h2>Ground control points and ortho image</h2>${stageHtml(c,ids)}</div>`;
    stageInit(c,ids,['outer','gcp']);
  },
  satellite(c){
    const ids=['outer','ward'];
    $('#app').innerHTML = band(c,'satellite') + `<div class="wrap"><p class="lead">Geospatial intelligence – drone and satellite imagery used in urban infrastructure planning, design and management.</p>
      ${stageHtml(c,ids)}</div>`;
    stageInit(c,ids,['outer'],'satellite');
  },
  analysis(c){
    const ids=['outer','rivers','contours','dsm','drains'];
    $('#app').innerHTML = band(c,'analysis') + `<div class="wrap"><p class="lead">Terrain and rainfall analysis that feeds the drainage design.</p>
      <h2 style="margin-top:0">Contour maps</h2>
      <p class="lead">Terrain elevation, contours and the drainage network with elevation.</p>
      ${stageHtml(c,ids)}<p class="note">Contours at 0.5 m interval, coloured from low (blue) to high (brown); every 5 m line is drawn thicker. Click a line for its level.</p><div style="margin-top:14px">${todo(c,'Elevation (DSM) surface and natural-drainage catchment map.')}</div>
      <h2>Rainfall data</h2>
      <p class="lead">Rainfall data from the India Meteorological Department – deriving Intensity–Duration–Frequency (IDF) curves.</p>
      <div class="card" style="text-align:center"><a href="img_idf.jpg" target="_blank"><img src="img_idf.jpg" alt="IDF curves – concept illustration" style="max-width:900px;width:100%;border-radius:8px"></a><p class="note">Concept illustration from the project presentation.</p></div>
      <div style="margin-top:14px">${todo(c,'City-specific IMD rainfall record and IDF curve table.')}</div></div>`;
    stageInit(c,ids,['outer','rivers','contours']);
  },
  drainage(c){
    const ids=['ward','outer','buffer','rivers','drains','culverts','photos'];
    $('#app').innerHTML = band(c,'drainage') + `<div class="wrap">
      <div class="grid g4" style="margin-bottom:16px">${stat('Drains surveyed',fmt(c.drains),'km')}${stat('Culverts mapped',fmt(c.culverts,0))}${stat('Wards',fmt(c.wards,0))}${stat('Nagar Nigam area',fmt(c.area,2),'km²')}</div>
      ${stageHtml(c,ids)}<p class="note">Click a drain, culvert or ward on the map for details.</p></div>`;
    stageInit(c,ids,['outer','rivers','drains','culverts']);
  },
  measures(c){
    $('#app').innerHTML = band(c,'measures') + `<div class="wrap"><h2 style="margin-top:0">Solutions for improvement of the storm water drainage system</h2>
      <div class="grid g3">
        <div class="sol" style="background:#dcefd9"><span class="n">Solution 1</span><h3>Augmentation of Drain Capacity</h3>Increase the conveyance of existing drains by widening or deepening and by constructing missing links. Large drain sizes may require land acquisition.</div>
        <div class="sol" style="background:#fdf3cf"><span class="n">Solution 2</span><h3>Alternate / Bypass Drain Alignments</h3>GIS-based study to provide additional feasible drain alignments, reducing drain sizes and easing implementation. Public-friendly, with minimum or no land acquisition.</div>
        <div class="sol" style="background:#fbe3d6"><span class="n">Solution 3</span><h3>Lake Management through Flood Attenuation</h3>Retain flood waters in natural lakes of the drainage basin and regulate sluices ahead of the flood inflow, reducing the peak flow and the required downstream drain size.</div>
      </div>
      <h2>Sponge infrastructure initiatives</h2>
      <div class="grid g3">${CONFIG.options.map(o=>`<div class="card opt"><a href="${o.img}" target="_blank"><img src="${o.img}" alt="${o.t}" loading="lazy"></a><div class="b"><h3><span class="no">${o.n}</span>${o.t}</h3><p>${o.d}</p></div></div>`).join('')}</div>
      <p class="note">Concept options from the project presentation. City-specific proposals for ${c.name} will follow the master plan.</p></div>`;
  },
  costs(c){
    const v = c.costs || [], any = v.some(x=>x!=null), tot = v.reduce((a,x)=>a+(x||0),0);
    $('#app').innerHTML = band(c,'costs') + `<div class="wrap"><h2 style="margin-top:0">Project cost summary</h2>
      <div class="tw"><table><thead><tr><th>S. No.</th><th>Project component</th><th class="n">Cost (₹ crore)</th></tr></thead>
      <tbody>${CONFIG.costLines.map((l,i)=>`<tr><td>${i+1}</td><td>${l}</td><td class="n">${fmt(v[i],2)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">GRAND TOTAL</td><td class="n">${any?fmt(tot,2):'—'}</td></tr></tfoot></table></div>
      <p class="note">Costs will be filled in once the estimates for ${c.name} are finalised. Prioritisation of projects, phasing of implementation and funding (SDMF, State, ULB) follow the master plan.</p></div>`;
  },
  progress(c){
    const ids = CONFIG.layers.map(l=>l.id);
    const right = `<aside class="panel right"><div class="ph" style="display:block"><div class="k">Survey progress</div><h2>${c.name}</h2></div>
      <div class="pb"><div class="wprrow"><span>Latest WPR</span><b>${c.live?CONFIG.latestWPR:'—'}</b></div>
      ${CONFIG.progressTemplate.map(t=>{const v=(c.progress||{})[t.name]||[]; return progCard({...t,done:v[0],est:v[1]});}).join('')}
      <div class="pc" style="--c:#0a2a66"><div class="t"><span>Survey Team</span></div>
        <div class="nums three"><div><div class="l">Rovers</div><div class="big">${fmt(c.team&&c.team.rovers)}</div></div>
        <div><div class="l">Base</div><div class="big">${fmt(c.team&&c.team.base)}</div></div>
        <div><div class="l">Members</div><div class="big">${fmt(c.team&&c.team.members)}</div></div></div></div></div></aside>`;
    $('#app').innerHTML = band(c,'progress') + `<div class="wrap">${stageHtml(c,ids,right)}
      <p class="note">Survey, collection of data and preparation of the Integrated Urban Storm Water Drainage Master Plan.</p></div>`;
    stageInit(c,ids,['outer','drains']);
  },
  twin(c){
    const st=[["Survey integration and drainage inventory","Integrate drone LiDAR terrain data, high-resolution imagery, municipal records and field surveys in a common coordinate and elevation system. Map drains, culverts, inlets, outfalls, lakes, ponds, pumps and sluice gates with unique asset IDs."],
      ["Catchment analysis and flood assessment","Connect the spatial database to rainfall–runoff and drainage network models. Assess capacity, bottlenecks, backwater effects and flood pathways under agreed design storms and future development scenarios."],
      ["Testing and prioritising interventions","Compare drain rehabilitation, widening, alternate alignments, culvert improvements, pumping and lake regulation with detention ponds and other sponge city measures. Rank packages by flood reduction, cost and maintenance."],
      ["Master plan and DPR preparation","Establish catchment-wise proposals, alignments, indicative dimensions and phased investment priorities. Hand over editable GIS layers, model files, flood maps and an asset register."],
      ["Monitoring and operational readiness","Progressively connect rain gauges, drain and lake-level sensors, pump status and SCADA or command-centre systems to support threshold alerts and operator decisions."]];
    $('#app').innerHTML = band(c,'twin') + `<div class="wrap"><p class="lead">A digital twin is proposed as an integrated platform for preparing, reviewing and regularly updating stormwater drainage master plans and Detailed Project Reports. It links geospatial data, hydrological and hydraulic models, and field observations.</p>
      <div class="grid g3"><div class="card"><h3>Integrated Spatial Data</h3><p>Combine terrain, drainage assets, land use and upstream catchments in a consistent geospatial database.</p></div>
      <div class="card"><h3>Flood Simulation and Planning</h3><p>Assess network capacity, identify flood hotspots and compare structural and sponge city interventions.</p></div>
      <div class="card"><h3>Monitoring and Decision Support</h3><p>Progressively connect rainfall and water-level observations to support alerts, asset management and operations.</p></div></div>
      <h2>How the model is applied</h2>${st.map((s,i)=>`<div class="step"><div class="no">${i+1}</div><div><b>${s[0]}.</b> ${s[1]}</div></div>`).join('')}
      <div class="card lbar" style="margin-top:14px"><h3>Implementation recommendation</h3><p>Begin with a validated planning model for each ULB, pilot priority catchments and expand monitoring in stages. Benefits depend on survey quality, validation and sustained upkeep.</p></div></div>`;
  }
};

/* ---------- router ---------- */
function route(){
  clearMaps();
  const h = (location.hash || '#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if (!h.length){ landing(); window.scrollTo(0,0); return; }
  let tab = h[0];
  if (tab === 'city'){
    const c = cityOf(h[1]) || cityOf(current);
    current = c.id; try{ localStorage.setItem('iuswdmp_city', current); }catch(e){}
    tab = (h[2]==='contour'||h[2]==='rainfall') ? 'analysis' : (PAGES[h[2]] ? h[2] : 'progress');
    chrome(true, tab); PAGES[tab](c);
    document.title = `${TITLES[tab]} · ${c.name} · IUSWDMP`;
  } else if (tab === 'cities'){ chrome(true,'cities'); cities(); document.title = 'Cities · IUSWDMP'; }
  else { chrome(true,'about'); about(); document.title = 'About · IUSWDMP'; }
  window.scrollTo(0,0);
}
$('#foot').textContent = `© ${new Date().getFullYear()} ${CONFIG.department} · Technical Associate: ${CONFIG.consultant}`;
window.addEventListener('hashchange', route);
route();
</script>
